name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  format-check:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      # --all: pull_request checkouts don't have a local `main` ref for Nx's
      # default git-diff base, so diff-based format:check always fails here.
      - run: npx nx format:check --all

  # `nx run-many -t lint` gates every project against the root flat ESLint
  # config -- the two recommended sets plus the ambient-platform-read ban that
  # keeps unit specs from branching on process.platform, which is what makes a
  # unit spec's result the same on both runners (LINT-01, LINT-02, CORR-06).
  # Kept a distinct named job like format-check and fallow so a lint regression
  # surfaces as a red `lint` leg instead of inside the build/test battery, and
  # so it still runs when an earlier gate fails. No background sidecar block: it
  # runs in seconds, and a fifth cache producer would add a fifth mirrored hash
  # family to the cross-OS investigation this milestone exists for (D-33). No
  # build step either -- lint has no dependsOn, and the config's global ignores
  # block exists precisely so lint output does not depend on whether build ran.
  lint:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      # Exit 0 is NOT sufficient here, and that is the whole reason this is a
      # scripted step rather than `- run: npm run lint`. `npm run lint` is
      # `nx run-many -t lint`, and run-many with no matching target ANYWHERE
      # prints "NX No tasks were run" and exits 0 (measured). The `lint` target
      # is INFERRED by @nx/eslint/plugin (D-01) rather than declared, and D-35
      # leaves "does @nx/eslint infer lint identically on both OSes?" UNVERIFIED
      # BY DESIGN -- so "the target exists on this runner" is a live accepted
      # risk, and a bare exit-code check converts it into a GREEN leg instead of
      # a red one. Demanding the success LINE is RESEARCH's named discriminator
      # for LINT-01: it prints only when a task actually ran.
      #
      # NO_COLOR is load-bearing, not tidiness. With colour on, Nx bolds the
      # target name mid-phrase -- "ran target <esc>[1mlint<esc>[22m for project"
      # -- so the plain-text match never fires and the check fails on every run
      # including the good ones. A gate that always fails gets deleted just as
      # fast as one that never fires.
      #
      # The other half of CR-01 (nx.json silently losing the plugins[] entry) is
      # guarded locally by nx-target-inputs.spec.ts; this leg is what catches the
      # target failing to materialise on a RUNNER rather than in the config.
      - name: Lint, and prove the lint target actually ran
        env:
          NO_COLOR: '1'
        run: |
          set -euo pipefail
          npm run lint 2>&1 | tee lint.log
          grep -q 'Successfully ran target lint' lint.log

  # `fallow dead-code --fail-on-issues` gates the whole repo against dead code
  # (unused files/exports/deps + reachability). It is config-declared-clean via
  # .fallowrc.jsonc and base-independent, so it works identically on push and on
  # shallow pull_request checkouts -- unlike `fallow audit`, which needs an
  # origin/main diff base and fails open (exits 0) when that ref is absent.
  # Future option: `fallow audit --changed-since origin/main` for faster,
  # diff-scoped gating once the repo grows large enough to want it.
  fallow:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      - run: npm run fallow:ci

  # The consumer-action bundle drift guard (DOCS-06, Pitfall 1). A `uses:` action
  # resolves start-cache-server/index.js from the git ref -- never from npm, never
  # after a build -- so the committed esbuild bundle must stay in sync with
  # entry.ts and its inlined deps. check:action rebuilds it with the exact-pinned
  # esbuild and byte-diffs the committed file, exiting non-zero on staleness or a
  # hand edit. Kept a distinct
  # named job so a drift surfaces as a red action-bundle-drift job.
  action-bundle-drift:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      - run: npm run check:action
      # Type-check the committed bundle's whole esbuild-reachable graph via the
      # root tsconfig.action.json (entry.ts lives outside the package tsconfig, so
      # it otherwise ships in the bundle with zero type checking). This job already
      # owns "the committed bundle is correct", so the typecheck belongs here rather
      # than a new job. noEmit, so it never touches the bundle or the drift diff.
      - run: npm run typecheck:action

  # The npm tarball file-list guard (DOCS-06 / GOV-02, A1, Pitfall 2). Proves
  # files:["dist"] ships ONLY dist/ + LICENSE + README.md + package.json and
  # excludes every src/CI/dogfood internal (dogfood-stays-local, T-06-01-01). It
  # needs dist built first because the tarball includes the build output, so it
  # runs npm run build before the guard. Dependency-free node guard; distinct job.
  pack-check:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run pack:check

  # Advisory PPE-hygiene dogfood (TRUST-06 / D-12). Runs the shipped composite
  # action (ppe/action.yml) against a KNOWN-unsafe fixture workflow to prove it
  # self-installs exact-pinned zizmor + actionlint and emits findings. ADVISORY
  # only: the action runs its tools non-failing (zizmor --no-exit-codes,
  # actionlint exit swallowed), so findings surface as annotations, NEVER a gate
  # -- containment stays the sync gate + default-branch protection, never this
  # job. It targets ppe/fixtures/unsafe-workflow.yml (deliberately outside
  # .github/workflows so GitHub never runs it). Kept a distinct named job (like
  # fallow) separate from the typecheck/test battery. Its
  # "produces findings" behavior is the first-push live close for TRUST-06
  # (expect a human_needed/live confirm on the CI run).
  ppe:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: ./ppe
        with:
          path: ppe/fixtures/unsafe-workflow.yml

  # DOGFOOD (the real one): build / typecheck / test / integration run this repo's
  # OWN cacheable Nx tasks through the shipped ./start-cache-server loopback
  # sidecar, so CI produces real CROSS-RUN remote cache hits for real workloads --
  # not just the same-run, run_id-keyed proof jobs (dogfood-*, consumer-smoke,
  # publish, which drive scripted PUT/GETs instead). The block below is the
  # consumer-smoke pattern verbatim and is repeated IDENTICALLY in all four jobs:
  # pre-set the two NX_* vars in a REGULAR step, start the sidecar as a background
  # step, poll it, run the target, cancel:. Load-bearing details, all four jobs:
  #
  #   * GITHUB_TOKEN by process inheritance into the sidecar step (never via the
  #     workflow environment file, D-06). Without a resolvable token selectBackend
  #     degrades to the empty in-memory backend and the job caches NOTHING. Passed
  #     on pull_request too: selectBackend returns the WRITABLE Actions-cache
  #     backend there as well (pull_request is host-gated-trusted on github.com).
  #     Read-only on PRs is enforced by GitHub's PLATFORM -- cache scope isolation
  #     (a PR write lands in the PR ref's scope, invisible to the default branch)
  #     plus the read-only-cache token for untrusted triggers, whose saveCache
  #     no-ops through the backend's benign 409 path -- NOT by this code.
  #   * NOT push-gated, unlike the proof jobs: push runs WRITE the entries, PR runs
  #     READ the default-branch ones. `if: github.event_name == 'push'` here would
  #     throw away the whole PR read benefit.
  #   * The NX_* vars stay strictly per-job. Hoisting them to workflow `env:` would
  #     point every sidecar-less proof job at a dead server, so each of their Nx
  #     invocations would try (and fail) to reach 127.0.0.1:3000.
  #   * `cancel: cache-server` is MANDATORY (Pitfall 3). All three facts below were
  #     MEASURED here first: when they were established, the keywords shipped
  #     documented only in the 2026-06-25 changelog
  #     (https://github.blog/changelog/2026-06-25-actions-steps-can-now-be-run-in-parallel).
  #     The workflow-syntax reference has since documented the whole family
  #     (background:/wait:/wait-all:/cancel:/parallel:, corroborated 2026-07-26) and
  #     independently confirms all three, so they are now citable as well as measured.
  #     - OMIT it and the job hangs. Run 30172888579, probe with a background
  #       sidecar, a SUCCEEDING target and no cancel: -- the runner inserted a step
  #       literally named "Wait for all background steps", which never returned; the
  #       job died at its timeout-minutes cap (3m02s, conclusion cancelled). The
  #       implicit wait-all is real, and it is why timeout-minutes is worth keeping.
  #     - It does NOT need `if:` or a continue-on-error dance to survive a FAILING
  #       target. Run 30172032003: a probe with a failing step and a bare `cancel:`
  #       ran the cancel (conclusion success), tore the sidecar down, and went red in
  #       8 seconds. A cancel: step is not subject to skip-on-failure.
  #     - `if:` is REJECTED on a cancel: step: the runner refuses to parse the
  #       workflow ("Unexpected value 'if'", run 30171349564, no jobs scheduled).
  #   * `shell: bash` on both shell steps -- redundant on ubuntu, REQUIRED on the
  #     integration matrix's windows-11-arm leg (default there is pwsh, which fails
  #     on $GITHUB_ENV / $(...) / seq / [ ... ]). One block, not two variants.
  #
  # port 3000 is reused across all four jobs: Actions jobs get isolated runners, so
  # it is one sidecar per job and there is no clash. No chicken-and-egg in the
  # build job either -- a `uses:` action resolves the COMMITTED, drift-guarded
  # index.js bundle from the git ref, never from a build output.
  #
  # Latency note: each target is a single Nx task on this 1-project workspace, so
  # expect net-neutral-to-slightly-slower wall clock (sidecar start + poll + a
  # loopback GET/PUT + @actions/cache round-trips). Proving the shipped consumer
  # surface works on real tasks is the point; speed is not.
  build:
    runs-on: ubuntu-24.04-arm
    # Generic hang insurance, NOT a teardown workaround. `cancel:` needs no help:
    # a cancel: step is NOT subject to skip-on-failure -- measured on run
    # 30172032003, where a probe job with a failing step and a bare `cancel:` ran
    # the cancel (conclusion success), tore the sidecar down, and went red in 8s.
    # README.md:84's hang warning is about OMITTING cancel:, which is a different
    # thing. This bound only caps a genuine hang (a stalled npm ci, a wedged
    # vitest) at minutes instead of the 360-minute default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      - name: Pre-set the Nx cache client vars for the sidecar
        shell: bash
        run: |
          set -euo pipefail
          echo "NX_SELF_HOSTED_REMOTE_CACHE_SERVER=http://127.0.0.1:3000" >> "$GITHUB_ENV"
          # node, not openssl: openssl may be absent from the Windows runner's Git
          # Bash, while node is guaranteed present after setup-node. Mask BEFORE
          # the $GITHUB_ENV write -- entry.ts's core.setSecret only redacts once
          # the action step starts, far too late for anything echoed before that.
          token="$(node -e 'process.stdout.write(require("crypto").randomBytes(32).toString("hex"))')"
          echo "::add-mask::${token}"
          echo "NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN=${token}" >> "$GITHUB_ENV"
      - uses: ./start-cache-server
        id: cache-server
        background: true
        with:
          port: '3000'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for the loopback sidecar
        shell: bash
        run: |
          set -euo pipefail
          auth="Authorization: Bearer ${NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN}"
          code=000
          for _ in $(seq 1 30); do
            # Demand exactly 404: an authed GET on an unknown hash MISSes, and
            # every backend selectBackend can return answers it that way (Actions
            # cache, Releases reader, read-only memory alike). Accepting "any status
            # but 000" would pass a 401 -- i.e. a token-handshake mismatch, the one
            # failure this poll is best placed to catch -- after which every Nx
            # request 401s, best-effort read degradation kicks in, and the job goes
            # GREEN having cached nothing. 404 proves reachability AND auth, and also
            # rejects a squatter process on port 3000 answering with its own status.
            # 200 is the only other legitimate answer -- it needs a pre-existing
            # nx-cache-deadbeef entry, which nothing here creates, but it proves
            # reachability and auth just as well, so accept it rather than hard-fail
            # a job over it.
            # On connection-refused curl's -w already prints 000 and exits non-zero,
            # so swallow the exit with `|| true` -- NEVER `|| echo 000`, which
            # appends a second 000 and makes the status unparseable.
            # --max-time bounds EACH ATTEMPT at 10s (previously a hung response was
            # unbounded). Note the loop's worst case is therefore 30 x (10 + 1) =
            # ~5.5 min, NOT 30s -- still well under this job's timeout-minutes.
            code=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' -H "${auth}" "${NX_SELF_HOSTED_REMOTE_CACHE_SERVER}/v1/cache/deadbeef" || true)
            if [ "${code}" = "404" ] || [ "${code}" = "200" ]; then
              break
            fi
            sleep 1
          done
          if [ "${code}" != "404" ] && [ "${code}" != "200" ]; then
            echo "sidecar not ready on ${NX_SELF_HOSTED_REMOTE_CACHE_SERVER} after 30 attempts (last status ${code}, wanted 404 or 200)" >&2
            exit 1
          fi
      - run: npm run build
      - cancel: cache-server

  typecheck:
    runs-on: ubuntu-24.04-arm
    # Generic hang insurance -- see the build job.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      # Sidecar dogfood block. Rationale, and the traps it avoids, are documented
      # once above the build job (whose copy also carries the inline trap notes).
      # The EXECUTABLE shell must stay identical across all four wired jobs -- only
      # the final `npm run <target>` line may differ, and only build's copy carries
      # extra comments. Keep it that way, so the windows-11-arm integration leg
      # never drifts from the others. This is an unguarded invariant: nothing fails
      # if it drifts. cleanup-workflow.spec.ts is the precedent for asserting on a
      # workflow from a spec if that ever becomes worth enforcing -- note ci.yml is
      # NOT in nx.json's test inputs (only cleanup.yml is), so such a guard would
      # need ci.yml added there or it goes stale behind a cache hit.
      - name: Pre-set the Nx cache client vars for the sidecar
        shell: bash
        run: |
          set -euo pipefail
          echo "NX_SELF_HOSTED_REMOTE_CACHE_SERVER=http://127.0.0.1:3000" >> "$GITHUB_ENV"
          token="$(node -e 'process.stdout.write(require("crypto").randomBytes(32).toString("hex"))')"
          echo "::add-mask::${token}"
          echo "NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN=${token}" >> "$GITHUB_ENV"
      - uses: ./start-cache-server
        id: cache-server
        background: true
        with:
          port: '3000'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for the loopback sidecar
        shell: bash
        run: |
          set -euo pipefail
          auth="Authorization: Bearer ${NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN}"
          code=000
          for _ in $(seq 1 30); do
            code=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' -H "${auth}" "${NX_SELF_HOSTED_REMOTE_CACHE_SERVER}/v1/cache/deadbeef" || true)
            if [ "${code}" = "404" ] || [ "${code}" = "200" ]; then
              break
            fi
            sleep 1
          done
          if [ "${code}" != "404" ] && [ "${code}" != "200" ]; then
            echo "sidecar not ready on ${NX_SELF_HOSTED_REMOTE_CACHE_SERVER} after 30 attempts (last status ${code}, wanted 404 or 200)" >&2
            exit 1
          fi
      - run: npm run typecheck
      - cancel: cache-server

  test:
    runs-on: ubuntu-24.04-arm
    # Generic hang insurance -- see the build job.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      # Sidecar dogfood block -- see the build job above.
      - name: Pre-set the Nx cache client vars for the sidecar
        shell: bash
        run: |
          set -euo pipefail
          echo "NX_SELF_HOSTED_REMOTE_CACHE_SERVER=http://127.0.0.1:3000" >> "$GITHUB_ENV"
          token="$(node -e 'process.stdout.write(require("crypto").randomBytes(32).toString("hex"))')"
          echo "::add-mask::${token}"
          echo "NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN=${token}" >> "$GITHUB_ENV"
      - uses: ./start-cache-server
        id: cache-server
        background: true
        with:
          port: '3000'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for the loopback sidecar
        shell: bash
        run: |
          set -euo pipefail
          auth="Authorization: Bearer ${NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN}"
          code=000
          for _ in $(seq 1 30); do
            code=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' -H "${auth}" "${NX_SELF_HOSTED_REMOTE_CACHE_SERVER}/v1/cache/deadbeef" || true)
            if [ "${code}" = "404" ] || [ "${code}" = "200" ]; then
              break
            fi
            sleep 1
          done
          if [ "${code}" != "404" ] && [ "${code}" != "200" ]; then
            echo "sidecar not ready on ${NX_SELF_HOSTED_REMOTE_CACHE_SERVER} after 30 attempts (last status ${code}, wanted 404 or 200)" >&2
            exit 1
          fi
      - run: npm run test
      - cancel: cache-server

  # Integration tests hit real OS surface (real sockets, real filesystem/tmpdir),
  # so their Nx hash carries a `{ runtime: "node -p process.platform" }`
  # discriminator (see nx.json's integration inputs): the Linux and Windows hashes
  # differ, so both matrix legs run and a Linux cache never satisfies a Windows
  # run, while a local Windows `nx integration` computes the same "win32" hash and
  # hits that cache. process.platform is compiled into node, so it is stable across
  # shell (PowerShell/Git-Bash/cmd) and across x64-vs-arm64 or arm64 emulation --
  # unlike `env:RUNNER_OS` (unset off-CI) or a plain `env` var (whose key MSYS
  # uppercases while Nx's env hasher is case-sensitive). fail-fast off so a
  # Windows-only failure never hides the Ubuntu result. The `integration` target
  # runs the real *.integration.spec.ts suite (vitest.integration.config.mts) -- an
  # end-to-end createCacheServer PUT/GET round-trip over a real loopback socket --
  # so both matrix legs prove the socket/HTTP path cross-OS.
  #
  # This job carries the same sidecar dogfood block as build/typecheck/test (see
  # the build job for the full rationale), and it is the reason that block declares
  # `shell: bash` everywhere: GitHub's DEFAULT shell on windows-11-arm is pwsh,
  # which fails on $GITHUB_ENV, $(...), seq and [ ... ]. For the same reason the
  # loopback token comes from node rather than openssl, which may be absent from
  # the Windows runner's Git Bash while node is guaranteed after setup-node (curl
  # and Git Bash themselves are both present on the Windows runner). Cross-OS is
  # safe as-is: the OS discriminator above means the Linux and Windows legs compute
  # DIFFERENT Nx task hashes, so neither leg can ever restore the other's entry --
  # exactly the CORR-01 namespacing the store already relies on. port 3000 on both
  # legs is fine; each matrix leg is its own isolated runner.
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, windows-11-arm]
    runs-on: ${{ matrix.os }}
    # Generic hang insurance -- see the build job.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      - name: Pre-set the Nx cache client vars for the sidecar
        shell: bash
        run: |
          set -euo pipefail
          echo "NX_SELF_HOSTED_REMOTE_CACHE_SERVER=http://127.0.0.1:3000" >> "$GITHUB_ENV"
          token="$(node -e 'process.stdout.write(require("crypto").randomBytes(32).toString("hex"))')"
          echo "::add-mask::${token}"
          echo "NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN=${token}" >> "$GITHUB_ENV"
      - uses: ./start-cache-server
        id: cache-server
        background: true
        with:
          port: '3000'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for the loopback sidecar
        shell: bash
        run: |
          set -euo pipefail
          auth="Authorization: Bearer ${NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN}"
          code=000
          for _ in $(seq 1 30); do
            code=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' -H "${auth}" "${NX_SELF_HOSTED_REMOTE_CACHE_SERVER}/v1/cache/deadbeef" || true)
            if [ "${code}" = "404" ] || [ "${code}" = "200" ]; then
              break
            fi
            sleep 1
          done
          if [ "${code}" != "404" ] && [ "${code}" != "200" ]; then
            echo "sidecar not ready on ${NX_SELF_HOSTED_REMOTE_CACHE_SERVER} after 30 attempts (last status ${code}, wanted 404 or 200)" >&2
            exit 1
          fi
      - run: npm run integration
      - cancel: cache-server

  # The dogfood-seed / dogfood-verify pair is this phase's LIVE proof that the
  # cache really works (ROADMAP SC5) and doubles as the upgrade canary for the
  # exact-pinned @actions/cache dependency (ROBUST-03): a version bump that changes
  # the archive version hash surfaces here as a failed verify job, not a silently
  # degraded cache. The round-trip is split across TWO jobs keyed on the workflow
  # run id because a same-run, same-process read-back can succeed from local state
  # while the upload never reached GitHub's cache service -- two jobs prove the
  # bytes actually crossed the service. The jobs deliberately drive a DIRECT
  # scripted PUT/GET through the internal action rather than real Nx cached tasks,
  # because a task runner short-circuits on its own local hit and would leave the
  # server inert behind a green result (Pitfall 6). NO job-level permission block is
  # added on purpose: the runtime cache credentials (injected only into a JS action)
  # are independent of the workflow token grant, and a job-level block would REPLACE
  # the workflow-level grant wholesale rather than extend it. Both jobs run ONLY on
  # the default-branch push trigger, because the write gate trusts no other trigger
  # (push/schedule only) and the read-only path is exhaustively unit-tested instead.
  # action.yml's main points into the build output, so each job builds first.
  dogfood-seed:
    # run id as the cache hash: unique per run and already all-decimal, so it
    # satisfies the server's ^[a-f0-9]{1,512}$ hash validator with no massaging.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - uses: ./packages/github-cache
        with:
          hash: ${{ github.run_id }}
          operation: seed
        env:
          # selectBackend hands back the writable Actions-cache backend only when a
          # token resolves (GH_TOKEN || GITHUB_TOKEN); pass it by process inheritance
          # into the action step, never through the workflow environment file (D-06).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dogfood-verify:
    # Reads back exactly what dogfood-seed wrote, keyed on the same run id, so a real
    # cross-job HIT is the only way this job passes; a MISS fails the job loudly.
    if: github.event_name == 'push'
    needs: dogfood-seed
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - uses: ./packages/github-cache
        with:
          hash: ${{ github.run_id }}
          operation: verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # DOCS-06 LIVE PROOF: the consumer background-step round-trip (a first-push live
  # close, like dogfood/ppe). It consumes the PUBLIC start-cache-server action
  # exactly as an adopter would -- pre-set the two NX_* vars in a REGULAR step,
  # then `uses: ./start-cache-server` with `background: true` and a matching
  # `port` -- then drives a scripted PUT+GET against the pre-set
  # NX_SELF_HOSTED_REMOTE_CACHE_SERVER using the pre-set token, proving the
  # loopback sidecar serves a real round-trip through the write-trusted
  # Actions-cache backend. The `cancel:` teardown is MANDATORY: the implicit
  # wait-all before post-job cleanup would otherwise hang forever on the
  # never-exiting serve (Pitfall 3); cancel sends SIGTERM -> serve() drains
  # in-flight puts (ROBUST-04) -> clean exit. Push-gated: the write gate trusts
  # push/schedule only. GITHUB_TOKEN is passed to the action step by process
  # inheritance (mirroring dogfood-seed) -- without it selectBackend degrades to
  # the read-only memory backend and the proof would exercise the WRONG backend
  # (D-06). No job-level permissions block: the workflow-default contents:read
  # plus the JS-action-only runtime cache creds suffice (T-06-01-05).
  #
  # HANDSHAKE: a background step cannot export env to later steps (its
  # exportVariable $GITHUB_ENV writes are only processed after the step COMPLETES,
  # which for a background step is its `cancel:` teardown). So the consumer sets
  # the two NX_* vars in the prior regular step below (whose $GITHUB_ENV writes DO
  # propagate) and passes the matching fixed port; serve() adopts both.
  consumer-smoke:
    if: github.event_name == 'push'
    # Depend on action-bundle-drift so a drifted committed bundle short-circuits
    # this job instead of being silently papered over by a fresh rebuild. This job
    # now runs the COMMITTED start-cache-server/index.js as-is (no build:action
    # step) -- exactly the artifact an adopter resolves from the git ref -- so the
    # smoke test proves the shipped bytes work, not that a rebuild does.
    needs: action-bundle-drift
    runs-on: ubuntu-24.04-arm
    # Generic hang insurance -- see the build job. Its scripted round-trip steps can
    # genuinely fail (the 200 status check, the payload cmp), and its bare `cancel:`
    # handles that correctly; this only bounds a true hang.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      # Pre-set the Nx client vars HERE, in a regular step: a background step
      # cannot export env to later steps, but this step's $GITHUB_ENV writes do
      # propagate. The sidecar below adopts the pre-set token + matching port.
      - name: Pre-set the Nx cache client vars for the sidecar
        run: |
          set -euo pipefail
          echo "NX_SELF_HOSTED_REMOTE_CACHE_SERVER=http://127.0.0.1:3000" >> "$GITHUB_ENV"
          # Mask the bearer token BEFORE writing it to $GITHUB_ENV. entry.ts's
          # core.setSecret runs far too late -- it only redacts once the action
          # step starts, so anything echoing the value between here and there would
          # land unredacted. ::add-mask:: redacts from the moment it is processed.
          # node, not openssl -- same reasoning as the build job (see :179-182).
          token="$(node -e 'process.stdout.write(require("crypto").randomBytes(32).toString("hex"))')"
          echo "::add-mask::${token}"
          echo "NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN=${token}" >> "$GITHUB_ENV"
      - uses: ./start-cache-server
        id: cache-server
        background: true
        with:
          port: '3000'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Nx cache round-trip over the loopback sidecar
        env:
          # `cafe` prefix keeps the key valid hex (^[a-f0-9]+$) yet DISTINCT from the
          # dogfood-seed / publish `nx-cache-<run_id>` key. All three ubuntu jobs share
          # this run's Actions-cache scope; a bare run_id collides -- this job's PUT
          # would land in the very key dogfood-verify reads back (Actions cache is
          # first-write-wins), returning consumer-smoke's payload as wrong data.
          RUN_HASH: cafe${{ github.run_id }}
        run: |
          set -euo pipefail
          server="${NX_SELF_HOSTED_REMOTE_CACHE_SERVER:?NX_SELF_HOSTED_REMOTE_CACHE_SERVER not set (pre-set regular step missing?)}"
          token="${NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN:?NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN not set (pre-set regular step missing?)}"
          auth="Authorization: Bearer ${token}"
          # Wait for the loopback sidecar to accept connections: an authed GET on
          # an unknown hash returns 404 (up). On connection-refused, curl's -w
          # already prints 000 and exits non-zero, so swallow the exit with `|| true`
          # -- NOT `|| echo 000`, which appends a second 000 so code becomes "000000"
          # (!= "000") and breaks the poll on iteration 1 before the server binds.
          code=000
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "${auth}" "${server}/v1/cache/deadbeef" || true)
            if [ "${code}" != "000" ]; then
              break
            fi
            sleep 1
          done
          if [ "${code}" = "000" ]; then
            echo "sidecar never accepted connections on ${server} after 30s" >&2
            exit 1
          fi
          # PUT a payload keyed on the run id (all-decimal -> valid ^[a-f0-9]+$),
          # then read it back and byte-compare: a real round-trip through the
          # write-trusted Actions-cache backend.
          printf 'consumer-smoke-%s' "${RUN_HASH}" > payload.bin
          put=$(curl -s -o /dev/null -w '%{http_code}' -X PUT --data-binary @payload.bin -H "${auth}" "${server}/v1/cache/${RUN_HASH}")
          test "${put}" = "200"
          curl -fsS -H "${auth}" "${server}/v1/cache/${RUN_HASH}" -o roundtrip.bin
          cmp payload.bin roundtrip.bin
          echo "[OK] consumer sidecar round-trip: PUT 200 + GET byte-match on ${RUN_HASH}"
      - cancel: cache-server

  # The per-OS publish matrix is this phase's LIVE mirror path (D-03, TRUST-02): on a
  # default-branch push each leg enumerates the default-branch Actions-cache entries via
  # getActionsCacheList, restores the nx-cache-* ones IT CAN restore on ITS OWN OS, and
  # uploads them to the current month-shard GitHub Release. The matrix is LOAD-BEARING and
  # self-enforcing: @actions/cache folds the per-OS tmpdir path + a windows-only salt + the
  # compression method into the cache version hash, so an ubuntu leg can NEVER restore a
  # Windows-saved entry (restoreCache returns undefined and the engine skips it). Collapsing
  # this to one OS SILENTLY drops the other OS's entries (D-03) -- keep BOTH legs; fail-fast
  # off so a Windows-only failure never hides the ubuntu result. It runs as `operation: publish`
  # on the node24 JS action, NOT a `run: node` step, because @actions/cache restoreCache needs
  # the JS-action-only ACTIONS_RUNTIME_TOKEN/ACTIONS_RESULTS_URL runtime (a plain run: step
  # silently MISSes -- verified Phase 2). needs: build (NOT test): a failing test leg must never
  # skip the mirror and drop already-built entries (RESEARCH Anti-Patterns). if: !cancelled() &&
  # push -- the mirror runs only on the trusted push trigger, and isSyncTrusted re-checks the
  # default branch in-process as the load-bearing gate (D-01), not the workflow if: alone.
  publish:
    if: ${{ !cancelled() && github.event_name == 'push' }}
    needs: build
    strategy:
      fail-fast: false
      # max-parallel 1 serializes the OS legs (WR-01). Run concurrently, each leg
      # snapshots the shard's asset count once and caches it for the rest of its run,
      # so both legs can observe the shard at 999 and both pass the soft 1000-asset cap
      # check, pushing it to 1001 -- one past the documented cap. Serializing makes the
      # later leg's listReleaseAssets see the earlier leg's uploads, so its cap check is
      # accurate. Per-OS isolation is unchanged (each leg still runs on its own OS and
      # mirrors only the entries IT can restore); the only cost is a little wall-clock on
      # this push-only background mirror job. fail-fast stays off so a Windows-only
      # failure never hides the ubuntu result.
      max-parallel: 1
      matrix:
        os: [ubuntu-24.04-arm, windows-11-arm]
    runs-on: ${{ matrix.os }}
    # A job-level permissions block REPLACES the workflow grant (contents: read) WHOLESALE --
    # it does NOT merge. So this block MUST restate BOTH scopes: contents: write (create the
    # month-shard release + upload assets) AND actions: read (getActionsCacheList; omitting it
    # 404s the cache enumeration -- Pitfall 3). Least-privilege: exactly these two, nothing more.
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      # Seed a known entry keyed on the run id (all-decimal, satisfies the
      # ^[a-f0-9]{1,512}$ hash validator) so each OS leg has a DETERMINISTIC entry to
      # mirror -- and so the live cross-OS round-trip has a producer: publish-verify
      # reads <run_id> back through the real Releases reader below (the leg deferred
      # from Phase 3). Seed runs as a JS-action operation for the same reason publish
      # does (the Actions-cache runtime is JS-action-only).
      #
      # The seeds are NO LONGER the only nx-cache-* entries in play. build, typecheck,
      # test and integration now route their real Nx tasks through the sidecar, so a
      # default-branch push writes real `nx-cache-<taskhash>` entries too -- and those
      # pass isServerProducedKey, so getActionsCacheList enumerates them and this job
      # MIRRORS REAL TASK ARTIFACTS to the month shard. That is the intended dogfooding
      # outcome and is deliberately ACCEPTED here (the Releases mirror now holds real
      # task outputs, which is the whole point of a remote cache), with two consequences:
      #
      #   (a) Shard growth. On top of the ~3 run_id-keyed assets a push already added,
      #       expect ~5 real ones per input-changing push: 4 from the ubuntu leg (build,
      #       typecheck, test, integration-linux) and 1 from the windows leg
      #       (integration-win32, which only the Windows leg can restore). So roughly
      #       125 default-branch pushes inside ONE calendar month before that month's
      #       shard reaches RELEASE_ASSET_CAP -- and the cap already degrades to
      #       skip-and-warn (D-11), never a hard failure, while retention prunes shards
      #       past the window. Not a concern at this repo's push rate.
      #   (b) Wall clock. Uploads are throttled to ~1/sec, so publish gains a few
      #       seconds per push.
      #
      # SECURITY PROPERTY this now depends on: an Nx cache entry contains the task's
      # captured TERMINAL OUTPUT as well as its outputs, and `::add-mask::` redacts
      # LOGS ONLY -- never a cache payload. So what keeps this PUBLIC Releases mirror
      # safe is the invariant "no mirrored task ever prints a secret", NOT masking.
      # It holds today (build/typecheck/test/integration receive no secret), but it is
      # now a property of this wiring rather than an accident -- and these four jobs
      # are the reference implementation adopters copy. Never route a task that prints
      # a credential through the sidecar on a public repo.
      #
      # ALTERNATIVE, if shard growth ever does become a problem: scope this job to the
      # run_id seed only (filter the enumeration down to the seeded key) and let the
      # real task entries live in the Actions cache alone. Not done now -- it would
      # throw away the real cross-context mirror this change exists to prove.
      #
      # Key namespaces stay disjoint, but NOT for the reason one might assume: real Nx
      # task hashes here are ALL-DECIMAL 18-20 digits (Nx renders a 64-bit hash as a
      # decimal string; verified over 153 local cache entries, zero containing a-f), so
      # they are the same character class as a run id, not a contrasting hex. What keeps
      # them apart is numeric range plus construction: a run id is ~11 digits, and
      # `cafe<run_id>` is not all-decimal at all so it can never equal a task hash.
      # A `nx-cache-<run_id>` collision would need a 64-bit task hash whose decimal form
      # exactly equals THIS run's id -- about 1 in 1.8e19 per task. Negligible.
      - uses: ./packages/github-cache
        with:
          hash: ${{ github.run_id }}
          operation: seed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./packages/github-cache
        with:
          operation: publish
        env:
          # Token by process inheritance into the action step (D-06), never through the
          # workflow environment file. resolveGitHubToken reads GH_TOKEN || GITHUB_TOKEN.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The live cross-OS publish/read-back round-trip (the leg deferred from Phase 3). It
  # runs after the WHOLE publish matrix and, per OS, resolves the run-id entry that
  # matrix mirrored THROUGH THE REAL GitHub Releases reader -- invoked DIRECTLY
  # (createReleasesReadBackend(createReleasesReadClient(process.env)) in read-back.ts),
  # NOT selectBackend, which in a push (write-trusted) context returns the writable
  # Actions-cache backend rather than the reader (TRUST-05). Each OS leg reads back ONLY
  # its own-OS asset (<run_id>-<os> via releaseAssetName), so this proves the same-OS
  # publisher->reader contract against REAL published assets and exercises the 04-02
  # shard-window walk live; the wrong-OS MISS stays unit-proven. The reader is native
  # fetch (no ACTIONS_RUNTIME_TOKEN), so this is a plain `node` step, not a JS action.
  # It needs only the workflow-default contents: read to fetch a release asset, so it
  # adds NO job-level permissions block and never touches the write gate. Mirrors the
  # dogfood-verify shape: push-gated, needs the producer, a MISS fails the job loud
  # (the reader swallows faults to a MISS, so any MISS is a round-trip failure).
  publish-verify:
    if: github.event_name == 'push'
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: node packages/github-cache/dist/roundtrip/read-back.js
        env:
          # The reader resolves its token from GH_TOKEN || GITHUB_TOKEN (tier 1) and the
          # repo from GITHUB_REPOSITORY (runner-injected); GITHUB_RUN_ID is the hash.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
