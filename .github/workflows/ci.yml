name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  format-check:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      # --all: pull_request checkouts don't have a local `main` ref for Nx's
      # default git-diff base, so diff-based format:check always fails here.
      - run: npx nx format:check --all

  # `nx run-many -t lint` gates every project against the root flat ESLint
  # config -- the two recommended sets plus the ambient-platform-read ban that
  # keeps unit specs from branching on process.platform, which is what makes a
  # unit spec's result the same on both runners (LINT-01, LINT-02, CORR-06).
  # Kept a distinct named job like format-check and fallow so a lint regression
  # surfaces as a red `lint` leg instead of inside the build/test battery, and
  # so it still runs when an earlier gate fails. No background sidecar block: it
  # runs in seconds, and a fifth cache producer would add a fifth mirrored hash
  # family to the cross-OS investigation this milestone exists for (D-33). No
  # build step either -- lint has no dependsOn, and the config's global ignores
  # block exists precisely so lint output does not depend on whether build ran.
  lint:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      # Exit 0 is NOT sufficient here, and that is the whole reason this is a
      # scripted step rather than `- run: npm run lint`. `npm run lint` is
      # `nx run-many -t lint`, and run-many with no matching target ANYWHERE
      # prints "NX No tasks were run" and exits 0 (measured). The `lint` target
      # is INFERRED by @nx/eslint/plugin (D-01) rather than declared, and D-35
      # leaves "does @nx/eslint infer lint identically on both OSes?" UNVERIFIED
      # BY DESIGN -- so "the target exists on this runner" is a live accepted
      # risk, and a bare exit-code check converts it into a GREEN leg instead of
      # a red one. Demanding the success LINE is RESEARCH's named discriminator
      # for LINT-01: it prints only when a task actually ran.
      #
      # NO_COLOR is load-bearing, not tidiness. With colour on, Nx bolds the
      # target name mid-phrase -- "ran target <esc>[1mlint<esc>[22m for project"
      # -- so the plain-text match never fires and the check fails on every run
      # including the good ones. A gate that always fails gets deleted just as
      # fast as one that never fires.
      #
      # The other half of CR-01 (nx.json silently losing the plugins[] entry) is
      # guarded locally by nx-target-inputs.spec.ts; this leg is what catches the
      # target failing to materialise on a RUNNER rather than in the config.
      - name: Lint, and prove the lint target actually ran
        env:
          NO_COLOR: '1'
        run: |
          set -euo pipefail
          npm run lint 2>&1 | tee lint.log
          grep -q 'Successfully ran target lint' lint.log

  # `fallow dead-code --fail-on-issues` gates the whole repo against dead code
  # (unused files/exports/deps + reachability). It is config-declared-clean via
  # .fallowrc.jsonc and base-independent, so it works identically on push and on
  # shallow pull_request checkouts -- unlike `fallow audit`, which needs an
  # origin/main diff base and fails open (exits 0) when that ref is absent.
  # Future option: `fallow audit --changed-since origin/main` for faster,
  # diff-scoped gating once the repo grows large enough to want it.
  fallow:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      - run: npm run fallow:ci

  # The consumer-action bundle drift guard (DOCS-06, Pitfall 1). A `uses:` action
  # resolves start-cache-server/index.js from the git ref -- never from npm, never
  # after a build -- so the committed esbuild bundle must stay in sync with
  # entry.ts and its inlined deps. check:action rebuilds it with the exact-pinned
  # esbuild and byte-diffs the committed file, exiting non-zero on staleness or a
  # hand edit. Kept a distinct
  # named job so a drift surfaces as a red action-bundle-drift job.
  action-bundle-drift:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      - run: npm run check:action
      # Type-check the committed bundle's whole esbuild-reachable graph via the
      # root tsconfig.action.json (entry.ts lives outside the package tsconfig, so
      # it otherwise ships in the bundle with zero type checking). This job already
      # owns "the committed bundle is correct", so the typecheck belongs here rather
      # than a new job. noEmit, so it never touches the bundle or the drift diff.
      - run: npm run typecheck:action

  # The npm tarball file-list guard (DOCS-06 / GOV-02, A1, Pitfall 2). Proves
  # files:["dist"] ships ONLY dist/ + LICENSE + README.md + package.json and
  # excludes every src/CI/dogfood internal (dogfood-stays-local, T-06-01-01). It
  # needs dist built first because the tarball includes the build output, so it
  # runs npm run build before the guard. Dependency-free node guard; distinct job.
  pack-check:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run pack:check

  # Advisory PPE-hygiene dogfood (TRUST-06 / D-12). Runs the shipped composite
  # action (ppe/action.yml) against a KNOWN-unsafe fixture workflow to prove it
  # self-installs exact-pinned zizmor + actionlint and emits findings. ADVISORY
  # only: the action runs its tools non-failing (zizmor --no-exit-codes,
  # actionlint exit swallowed), so findings surface as annotations, NEVER a gate
  # -- containment stays the sync gate + default-branch protection, never this
  # job. It targets ppe/fixtures/unsafe-workflow.yml (deliberately outside
  # .github/workflows so GitHub never runs it). Kept a distinct named job (like
  # fallow) separate from the typecheck/test battery. Its
  # "produces findings" behavior is the first-push live close for TRUST-06
  # (expect a human_needed/live confirm on the CI run).
  ppe:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: ./ppe
        with:
          path: ppe/fixtures/unsafe-workflow.yml

  # DOGFOOD (the real one): build / typecheck / test / integration run this repo's
  # OWN cacheable Nx tasks through the shipped ./start-cache-server loopback
  # sidecar, so CI produces real CROSS-RUN remote cache hits for real workloads --
  # not just the same-run, run_id-keyed proof jobs (dogfood-*, consumer-smoke,
  # publish, which drive scripted PUT/GETs instead). The block below is the
  # consumer-smoke pattern verbatim and is repeated IDENTICALLY in all four jobs:
  # pre-set the two NX_* vars in a REGULAR step, start the sidecar as a background
  # step, poll it, run the target, cancel:. Load-bearing details, all four jobs:
  #
  #   * GITHUB_TOKEN by process inheritance into the sidecar step (never via the
  #     workflow environment file, D-06). Without a resolvable token selectBackend
  #     degrades to the empty in-memory backend and the job caches NOTHING. Passed
  #     on pull_request too: selectBackend returns the WRITABLE Actions-cache
  #     backend there as well (pull_request is host-gated-trusted on github.com).
  #     Read-only on PRs is enforced by GitHub's PLATFORM -- cache scope isolation
  #     (a PR write lands in the PR ref's scope, invisible to the default branch)
  #     plus the read-only-cache token for untrusted triggers, whose saveCache
  #     no-ops through the backend's benign 409 path -- NOT by this code.
  #   * NOT push-gated, unlike the proof jobs: push runs WRITE the entries, PR runs
  #     READ the default-branch ones. `if: github.event_name == 'push'` here would
  #     throw away the whole PR read benefit.
  #   * The NX_* vars stay strictly per-job. Hoisting them to workflow `env:` would
  #     point every sidecar-less proof job at a dead server, so each of their Nx
  #     invocations would try (and fail) to reach 127.0.0.1:3000.
  #   * `cancel: cache-server` is MANDATORY (Pitfall 3). All three facts below were
  #     MEASURED here first: when they were established, the keywords shipped
  #     documented only in the 2026-06-25 changelog
  #     (https://github.blog/changelog/2026-06-25-actions-steps-can-now-be-run-in-parallel).
  #     The workflow-syntax reference has since documented the whole family
  #     (background:/wait:/wait-all:/cancel:/parallel:, corroborated 2026-07-26) and
  #     independently confirms all three, so they are now citable as well as measured.
  #     - OMIT it and the job hangs. Run 30172888579, probe with a background
  #       sidecar, a SUCCEEDING target and no cancel: -- the runner inserted a step
  #       literally named "Wait for all background steps", which never returned; the
  #       job died at its timeout-minutes cap (3m02s, conclusion cancelled). The
  #       implicit wait-all is real, and it is why timeout-minutes is worth keeping.
  #     - It does NOT need `if:` or a continue-on-error dance to survive a FAILING
  #       target. Run 30172032003: a probe with a failing step and a bare `cancel:`
  #       ran the cancel (conclusion success), tore the sidecar down, and went red in
  #       8 seconds. A cancel: step is not subject to skip-on-failure.
  #     - `if:` is REJECTED on a cancel: step: the runner refuses to parse the
  #       workflow ("Unexpected value 'if'", run 30171349564, no jobs scheduled).
  #   * `shell: bash` on both shell steps -- redundant on ubuntu, REQUIRED on the
  #     integration matrix's windows-11-arm leg (default there is pwsh, which fails
  #     on $GITHUB_ENV / $(...) / seq / [ ... ]). One block, not two variants.
  #
  # port 3000 is reused across all four jobs: Actions jobs get isolated runners, so
  # it is one sidecar per job and there is no clash. No chicken-and-egg in the
  # build job either -- a `uses:` action resolves the COMMITTED, drift-guarded
  # index.js bundle from the git ref, never from a build output.
  #
  # Latency note: each target is a single Nx task on this 1-project workspace, so
  # expect net-neutral-to-slightly-slower wall clock (sidecar start + poll + a
  # loopback GET/PUT + @actions/cache round-trips). Proving the shipped consumer
  # surface works on real tasks is the point; speed is not.
  build:
    runs-on: ubuntu-24.04-arm
    # Generic hang insurance, NOT a teardown workaround. `cancel:` needs no help:
    # a cancel: step is NOT subject to skip-on-failure -- measured on run
    # 30172032003, where a probe job with a failing step and a bare `cancel:` ran
    # the cancel (conclusion success), tore the sidecar down, and went red in 8s.
    # README.md:84's hang warning is about OMITTING cancel:, which is a different
    # thing. This bound only caps a genuine hang (a stalled npm ci, a wedged
    # vitest) at minutes instead of the 360-minute default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      - name: Pre-set the Nx cache client vars for the sidecar
        shell: bash
        run: |
          set -euo pipefail
          echo "NX_SELF_HOSTED_REMOTE_CACHE_SERVER=http://127.0.0.1:3000" >> "$GITHUB_ENV"
          # node, not openssl: openssl may be absent from the Windows runner's Git
          # Bash, while node is guaranteed present after setup-node. Mask BEFORE
          # the $GITHUB_ENV write -- entry.ts's core.setSecret only redacts once
          # the action step starts, far too late for anything echoed before that.
          token="$(node -e 'process.stdout.write(require("crypto").randomBytes(32).toString("hex"))')"
          echo "::add-mask::${token}"
          echo "NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN=${token}" >> "$GITHUB_ENV"
      - uses: ./start-cache-server
        id: cache-server
        background: true
        with:
          port: '3000'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for the loopback sidecar
        shell: bash
        run: |
          set -euo pipefail
          auth="Authorization: Bearer ${NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN}"
          code=000
          for _ in $(seq 1 30); do
            # Demand exactly 404: an authed GET on an unknown hash MISSes, and
            # every backend selectBackend can return answers it that way (Actions
            # cache, Releases reader, read-only memory alike). Accepting "any status
            # but 000" would pass a 401 -- i.e. a token-handshake mismatch, the one
            # failure this poll is best placed to catch -- after which every Nx
            # request 401s, best-effort read degradation kicks in, and the job goes
            # GREEN having cached nothing. 404 proves reachability AND auth, and also
            # rejects a squatter process on port 3000 answering with its own status.
            # 200 is the only other legitimate answer -- it needs a pre-existing
            # nx-cache-deadbeef entry, which nothing here creates, but it proves
            # reachability and auth just as well, so accept it rather than hard-fail
            # a job over it.
            # On connection-refused curl's -w already prints 000 and exits non-zero,
            # so swallow the exit with `|| true` -- NEVER `|| echo 000`, which
            # appends a second 000 and makes the status unparseable.
            # --max-time bounds EACH ATTEMPT at 10s (previously a hung response was
            # unbounded). Note the loop's worst case is therefore 30 x (10 + 1) =
            # ~5.5 min, NOT 30s -- still well under this job's timeout-minutes.
            code=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' -H "${auth}" "${NX_SELF_HOSTED_REMOTE_CACHE_SERVER}/v1/cache/deadbeef" || true)
            if [ "${code}" = "404" ] || [ "${code}" = "200" ]; then
              break
            fi
            sleep 1
          done
          if [ "${code}" != "404" ] && [ "${code}" != "200" ]; then
            echo "sidecar not ready on ${NX_SELF_HOSTED_REMOTE_CACHE_SERVER} after 30 attempts (last status ${code}, wanted 404 or 200)" >&2
            exit 1
          fi
      - run: npm run build
      - cancel: cache-server

  typecheck:
    runs-on: ubuntu-24.04-arm
    # Generic hang insurance -- see the build job.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      # Sidecar dogfood block. Rationale, and the traps it avoids, are documented
      # once above the build job (whose copy also carries the inline trap notes).
      # The EXECUTABLE shell must stay identical across all four wired jobs -- only
      # the final `npm run <target>` line may differ, and only build's copy carries
      # extra comments. Keep it that way, so the windows-11-arm integration leg
      # never drifts from the others. This is an unguarded invariant: nothing fails
      # if it drifts. cleanup-workflow.spec.ts is the precedent for asserting on a
      # workflow from a spec if that ever becomes worth enforcing -- note ci.yml is
      # NOT in nx.json's test inputs (only cleanup.yml is), so such a guard would
      # need ci.yml added there or it goes stale behind a cache hit.
      - name: Pre-set the Nx cache client vars for the sidecar
        shell: bash
        run: |
          set -euo pipefail
          echo "NX_SELF_HOSTED_REMOTE_CACHE_SERVER=http://127.0.0.1:3000" >> "$GITHUB_ENV"
          token="$(node -e 'process.stdout.write(require("crypto").randomBytes(32).toString("hex"))')"
          echo "::add-mask::${token}"
          echo "NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN=${token}" >> "$GITHUB_ENV"
      - uses: ./start-cache-server
        id: cache-server
        background: true
        with:
          port: '3000'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for the loopback sidecar
        shell: bash
        run: |
          set -euo pipefail
          auth="Authorization: Bearer ${NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN}"
          code=000
          for _ in $(seq 1 30); do
            code=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' -H "${auth}" "${NX_SELF_HOSTED_REMOTE_CACHE_SERVER}/v1/cache/deadbeef" || true)
            if [ "${code}" = "404" ] || [ "${code}" = "200" ]; then
              break
            fi
            sleep 1
          done
          if [ "${code}" != "404" ] && [ "${code}" != "200" ]; then
            echo "sidecar not ready on ${NX_SELF_HOSTED_REMOTE_CACHE_SERVER} after 30 attempts (last status ${code}, wanted 404 or 200)" >&2
            exit 1
          fi
      - run: npm run typecheck
      - cancel: cache-server

  test:
    runs-on: ubuntu-24.04-arm
    # Generic hang insurance -- see the build job.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      # Sidecar dogfood block -- see the build job above.
      - name: Pre-set the Nx cache client vars for the sidecar
        shell: bash
        run: |
          set -euo pipefail
          echo "NX_SELF_HOSTED_REMOTE_CACHE_SERVER=http://127.0.0.1:3000" >> "$GITHUB_ENV"
          token="$(node -e 'process.stdout.write(require("crypto").randomBytes(32).toString("hex"))')"
          echo "::add-mask::${token}"
          echo "NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN=${token}" >> "$GITHUB_ENV"
      - uses: ./start-cache-server
        id: cache-server
        background: true
        with:
          port: '3000'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for the loopback sidecar
        shell: bash
        run: |
          set -euo pipefail
          auth="Authorization: Bearer ${NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN}"
          code=000
          for _ in $(seq 1 30); do
            code=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' -H "${auth}" "${NX_SELF_HOSTED_REMOTE_CACHE_SERVER}/v1/cache/deadbeef" || true)
            if [ "${code}" = "404" ] || [ "${code}" = "200" ]; then
              break
            fi
            sleep 1
          done
          if [ "${code}" != "404" ] && [ "${code}" != "200" ]; then
            echo "sidecar not ready on ${NX_SELF_HOSTED_REMOTE_CACHE_SERVER} after 30 attempts (last status ${code}, wanted 404 or 200)" >&2
            exit 1
          fi
      - run: npm run test
      - cancel: cache-server

  # Integration tests hit real OS surface (real sockets, real filesystem/tmpdir),
  # so their Nx hash carries a `{ runtime: "node -p process.platform" }`
  # discriminator (see nx.json's integration inputs): the Linux and Windows hashes
  # differ, so both matrix legs run and a Linux cache never satisfies a Windows
  # run -- and from VER-01/VER-03 that Nx hash is the ONLY thing separating them,
  # because the cache STORAGE no longer partitions by OS. A local Windows
  # `nx integration` computes the same "win32" hash and hits that cache.
  # process.platform is compiled into node, so it is stable across
  # shell (PowerShell/Git-Bash/cmd) and across x64-vs-arm64 or arm64 emulation --
  # unlike `env:RUNNER_OS` (unset off-CI) or a plain `env` var (whose key MSYS
  # uppercases while Nx's env hasher is case-sensitive). fail-fast off so a
  # Windows-only failure never hides the Ubuntu result. The `integration` target
  # runs the real *.integration.spec.ts suite (vitest.integration.config.mts) -- an
  # end-to-end createCacheServer PUT/GET round-trip over a real loopback socket --
  # so both matrix legs prove the socket/HTTP path cross-OS.
  #
  # This job carries the same sidecar dogfood block as build/typecheck/test (see
  # the build job for the full rationale), and it is the reason that block declares
  # `shell: bash` everywhere: GitHub's DEFAULT shell on windows-11-arm is pwsh,
  # which fails on $GITHUB_ENV, $(...), seq and [ ... ]. For the same reason the
  # loopback token comes from node rather than openssl, which may be absent from
  # the Windows runner's Git Bash while node is guaranteed after setup-node (curl
  # and Git Bash themselves are both present on the Windows runner). Cross-OS is
  # safe as-is: the OS discriminator above means the Linux and Windows legs compute
  # DIFFERENT Nx task hashes, so neither leg can ever restore the other's entry --
  # and from VER-01/VER-03 that hash is the SOLE separation, because the STORE no
  # longer partitions by OS. XOS-03 is explicit that this divergence is a statement
  # about Nx HASHES and not about cache storage: a storage-level probe for the Linux
  # key from a Windows runner would now HIT. port 3000 on both
  # legs is fine; each matrix leg is its own isolated runner.
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, windows-11-arm]
    runs-on: ${{ matrix.os }}
    # Generic hang insurance -- see the build job.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      - name: Pre-set the Nx cache client vars for the sidecar
        shell: bash
        run: |
          set -euo pipefail
          echo "NX_SELF_HOSTED_REMOTE_CACHE_SERVER=http://127.0.0.1:3000" >> "$GITHUB_ENV"
          token="$(node -e 'process.stdout.write(require("crypto").randomBytes(32).toString("hex"))')"
          echo "::add-mask::${token}"
          echo "NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN=${token}" >> "$GITHUB_ENV"
      - uses: ./start-cache-server
        id: cache-server
        background: true
        with:
          port: '3000'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for the loopback sidecar
        shell: bash
        run: |
          set -euo pipefail
          auth="Authorization: Bearer ${NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN}"
          code=000
          for _ in $(seq 1 30); do
            code=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' -H "${auth}" "${NX_SELF_HOSTED_REMOTE_CACHE_SERVER}/v1/cache/deadbeef" || true)
            if [ "${code}" = "404" ] || [ "${code}" = "200" ]; then
              break
            fi
            sleep 1
          done
          if [ "${code}" != "404" ] && [ "${code}" != "200" ]; then
            echo "sidecar not ready on ${NX_SELF_HOSTED_REMOTE_CACHE_SERVER} after 30 attempts (last status ${code}, wanted 404 or 200)" >&2
            exit 1
          fi
      - run: npm run integration
      - cancel: cache-server

  # The two-leg hash-parity CAPTURE job (PARITY-03, PARITY-06; the capture half of
  # D-17). It runs capture-hashes.mjs on both runner OSes and uploads one record per
  # leg, so 08-ROOT-CAUSE.md can hold FOUR observation points -- two hand-captured on
  # a developer workstation, these two from real runners -- all taken at ONE commit.
  #
  # CAPTURE ONLY. The build-gating comparison is a separate job, deferred to plan
  # 08-06 (D-15 + D-18): pre-fix, the roadmap's own success criterion 1 says cold
  # ubuntu differs from cold windows for EVERY target, so a gate wired now would be
  # red for a reason the record has not established yet -- and D-18 forbids softening
  # that with continue-on-error.
  #
  # NOT push-gated, unlike the proof jobs. Every job in this file that carries that
  # gate does so because it WRITES (seeds a cache entry, publishes a release asset).
  # This one only measures. Same rule the read-side jobs state at :170-172.
  #
  # fail-fast: false carries a SECOND reason here on top of the one at :392-393 ("so
  # a Windows-only failure never hides the Ubuntu result"): with fail-fast ON, a
  # Windows leg failure CANCELS the Ubuntu leg, and 08-06's compare job then reports
  # "fewer than two records" for a reason that has nothing to do with hash parity.
  #
  # shell: bash on the capture step, for the reason recorded at :399-404 -- GitHub's
  # DEFAULT shell on windows-11-arm is pwsh, which fails on the constructs this
  # file's scripted steps use. A bare `- run:` with no shell key inherits pwsh there.
  #
  # NO SIDECAR BLOCK, deliberately rather than by oversight. build, typecheck, test
  # and integration each carry a ~35-line pre-set / background start-cache-server /
  # readiness-poll / cancel: block because they run CACHED Nx tasks. This job runs
  # none -- it computes hashes -- so it needs no cache client at all, and leaving the
  # block out removes an entire class of flake from a measurement that has to be
  # trusted.
  #
  # NO JOB-LEVEL permissions BLOCK, for the trap recorded in full at :943-946: such a
  # block REPLACES the workflow grant WHOLESALE rather than merging it, so adding one
  # "to be explicit" silently drops scopes. The workflow-level contents: read (:9-10)
  # covers checkout plus an artifact upload, and this job requests no secret.
  #
  # BUILD STEP, added by plan 08-05 and REPLACING a documented no-build design. The
  # original rationale is re-stated here rather than quietly reversed, because it was
  # half right and the half that was right still constrains this job.
  #
  # It read: typecheck declares a dependentTasksOutputFiles input (nx.json:137) which
  # hashes the CONTENT of packages/github-cache/dist/, so a leg that built hashes a
  # populated directory while a leg that did not hashes an empty one; both legs must
  # be IDENTICAL in that respect, and "neither builds" is the identical option that
  # is also the fastest.
  #
  # The symmetry requirement is CORRECT and is preserved -- see the note on the step
  # itself. The resolution was wrong: "both build" is equally symmetric, and it is
  # the only one of the two that measures a number any machine actually computes.
  #
  # What the original missed: typecheck carries an INFERRED dependsOn of
  # ["build", "^typecheck"], produced by @nx/js/typescript and absent from nx.json,
  # so Nx defers typecheck's hash until build has produced its outputs. A real
  # `nx typecheck` therefore computes the SAME hash whether or not dist/ was
  # populated beforehand -- measured both ways at 8949082127832201885 on the
  # maintainer's workstation, recorded in 08-ROOT-CAUSE.md under "CORRECTION: D-11's
  # consequence is FALSIFIED". Without a build step this job hashed typecheck OUTSIDE
  # that dependency chain and recorded 1284533355439392975 on both legs: internally
  # consistent, cross-OS identical, and computed by nothing. The cross-OS COMPARISON
  # was still valid (both legs were wrong the same way); the absolute value was not,
  # and 08-06 gates on these records.
  #
  # A reader comparing against pack-check and publish-verify (both of which also
  # build first) should read this paragraph rather than going looking: those jobs RUN
  # a dist/ bin, they do not measure a hash, so they build for an unrelated reason.
  #
  # CHECKOUT REF -- the one deliberate deviation from every other job in this file.
  # On a pull_request event actions/checkout resolves the MERGE commit by default: a
  # SHA no developer can reproduce locally, over a TREE that differs from the
  # branch's whenever the default branch has moved. Either one silently breaks
  # PARITY-03's "four values per target at ONE commit". Pinning to the PR head SHA
  # and falling back to github.sha on push makes the same step measure the branch
  # tree on both events. The instrument records BOTH the checked-out HEAD
  # (meta.commit) and the runner-provided event SHA (meta.githubSha) so the pin is
  # inspectable rather than assumed.
  #
  # WHAT CHECKS THAT PIN, AND IN WHICH DIRECTION -- corrected here, because an
  # earlier wording of this block had it backwards and implied a check no code
  # performs. GITHUB_SHA on a pull_request event IS the merge commit, set by the
  # runner from the event payload; it does not follow what the job checked out. So
  # AGREEMENT between the two fields on a pull_request is the pin FAILING (the
  # checkout landed on the merge commit), and disagreement in the specific direction
  # "commit == PR head, githubSha == merge commit" is the pin WORKING. On a push
  # they agree, and that is also correct. The right reading is therefore
  # "meta.commit must equal the anchor", never "the two fields must agree".
  #
  # The comparator deliberately does NOT assert on githubSha, and that is not an
  # oversight: the correct direction is EVENT-dependent and the comparator has no
  # event context, githubSha is null off a runner by design, and HashParityRecord
  # does not model a field this module would neither check nor use. What IS enforced
  # is the failure this pin actually produces -- the two legs measuring different
  # trees -- via the cross-leg `meta.commit` equality clause (`not-like-for-like` in
  # compare.ts), added because meta.os had been the only one of the seven meta keys
  # compared across the pair. 08-ROOT-CAUSE.md carries the one-off API cross-check
  # (gh api .../pulls/9) that confirmed the pin held on both legs at the anchor.
  #
  # THE REPO HAD NO PRIOR ARTIFACT USAGE. The complete third-party action inventory
  # across both workflows was actions/checkout and actions/setup-node, so there is no
  # in-repo major to match and no precedent to copy -- upload-artifact@v7 here and
  # download-artifact@v8 in 08-06 are asymmetric ON PURPOSE (v8 of the download
  # action pairs itself with v7 of the upload action throughout its own README).
  # The artifact NAME must be unique per leg: v4 onward made names immutable, so two
  # legs uploading to one name is an error rather than a merge, and the matrix OS
  # value is the natural discriminator. if-no-files-found: error is not tidiness --
  # the default is `warn`, so without it a leg whose instrument produced nothing
  # uploads an EMPTY artifact, the download merges it into nothing, and the
  # comparator reports "fewer than two records": the correct verdict with the wrong
  # blame, one job further from the cause than necessary. A leg that measured nothing
  # must fail ITS OWN leg.
  #
  # This comment block is the ONLY place that rationale can live. ci.yml is NOT in
  # nx.json's `test` inputs (only cleanup.yml is, nx.json:68), so a spec asserting on
  # this file's content would serve a stale cached PASS; registering it is PARITY-08,
  # deferred to Phase 9 so its hash rotation collapses into VER-01's window.
  hash-parity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, windows-11-arm]
    runs-on: ${{ matrix.os }}
    # Generic hang insurance -- see the build job.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      # Hash typecheck INSIDE its dependency chain. typecheck's inferred dependsOn
      # is ["build", "^typecheck"], and the instrument calls hashTask directly, so
      # without this step the recorded typecheck value is one no real run produces
      # -- see the BUILD STEP paragraph above.
      #
      # This is ONE step in a matrix job, so both legs get byte-identical treatment
      # by construction rather than by two copies staying in step. That symmetry is
      # the half of the original no-build rationale that survives: whatever this job
      # does about dist/, it must do the same on ubuntu-24.04-arm and on
      # windows-11-arm, or the leg-to-leg comparison stops comparing like with like.
      #
      # Still no sidecar block: `npm run build` here resolves through Nx's LOCAL
      # cache only, because the cache client is env-driven and this job sets none of
      # those variables. A fresh runner therefore always really builds.
      - run: npm run build
      # The instrument is invoked as a plain node script, never through `nx run`
      # (D-01b): an Nx-CACHED instrument would REPLAY a stale record instead of
      # measuring. --install-mode is REQUIRED and has no default, and `ci` is the
      # honest value because the step above ran a clean install.
      - name: Capture the Nx task hashes on this runner
        shell: bash
        env:
          # Disabling the daemon is the CALLER's job BY DESIGN: the instrument
          # MEASURES daemonEnabled rather than forcing it, so a leg that forgot is
          # visible in the record instead of being silently reclassified.
          NX_DAEMON: 'false'
          # Passed in through env rather than interpolated into the script body, so
          # the matrix value never lands on a command line the shell re-parses.
          RECORD: hash-parity-${{ matrix.os }}.json
        run: |
          set -euo pipefail
          node capture-hashes.mjs --install-mode ci --out "$RECORD"
      - uses: actions/upload-artifact@v7
        with:
          name: hash-parity-${{ matrix.os }}
          path: hash-parity-${{ matrix.os }}.json
          if-no-files-found: error

  # The BUILD-GATING hash-parity comparison (CORR-03, D-15's fourth and last step,
  # D-17's compare half, D-18, D-20, D-21, D-23). It downloads both capture legs'
  # records and runs the unit-proven comparator over them, so PARITY-03 is ENFORCED
  # on every run rather than measured once in 08-ROOT-CAUSE.md and then trusted.
  #
  # WHAT IT ASSERTS, via packages/github-cache/src/hash-parity/compare.ts: exactly
  # two platform records with a non-empty hash and a non-empty node map for all five
  # targets; DIFFERENT meta.os on the two; `integration` DIVERGENT between them; and
  # `build`, `typecheck`, `test` and `lint` IDENTICAL between them. Note the sign on
  # `integration`: a MATCHING integration hash is a discriminator FAILURE, not a
  # parity success, because that target is the only one declaring a platform runtime
  # input (nx.json:101, D-14). `lint` is the FOURTH invariant target rather than a
  # recorded observation -- D-21's PRIMARY branch, taken because plan 08-05 measured
  # `lint` byte-identical across both legs (6930879416208693542 on each). D-21's
  # named fallback (downgrade the clause to a recorded finding) therefore does NOT
  # apply, and either way the clause is never DELETED: a deleted clause is
  # indistinguishable from one that never existed.
  #
  # NO continue-on-error AND NO ADVISORY PERIOD (D-18). This job is build-gating from
  # its first commit. A later addition of continue-on-error would be invisible in a
  # green run, which is why the observed-RED record in 08-ROOT-CAUSE.md's
  # "The gate can fail" section carries run references as the reference point.
  #
  # if: !cancelled() -- CHOSEN DELIBERATELY, not by reflex. D-17 names `always()`,
  # and what D-17 actually REQUIRES is that a FAILED or SKIPPED capture leg still
  # arrives at the assertion: "fewer than two records is a FAILURE, not a skip" is
  # unreachable if the compare job simply skips alongside its dead upstream. The two
  # forms differ on exactly one case -- cancellation -- and a cancelled run producing
  # a red gate is noise, not signal. `!cancelled()` covers failure and skip, and it
  # is ALREADY this file's house form for a dependent job (`publish` at :926 uses
  # exactly it). So the narrower expression satisfies D-17's intent and matches
  # precedent at the same time.
  #
  # The if: expression governs whether this job RUNS. NOTHING in it may govern
  # whether this job PASSES (D-23): the verdict comes from record CONTENT only, never
  # from needs.*.result. A leg can succeed and still have uploaded a truncated
  # record, and a leg can fail AFTER a valid upload -- deriving the verdict from job
  # status inverts both cases. There is deliberately no needs.*.result reference
  # anywhere below.
  #
  # A SINGLE ubuntu runner, not a matrix. This job compares two records; it is not
  # per-OS. It is also the FIRST job in this file that collapses a matrix's legs into
  # ONE downstream job that sees both -- every other `needs` here either fans in from
  # a single job (`dogfood-verify` needs `dogfood-seed`, `consumer-smoke` needs
  # `action-bundle-drift`) or is itself a matrix pairing up leg-by-leg
  # (`publish-verify` needs `publish`). A reader looking for an in-repo precedent for
  # the fan-in shape should read this sentence rather than go looking: there is none.
  #
  # NO JOB-LEVEL permissions BLOCK, for the trap recorded in full at :943-946: such a
  # block REPLACES the workflow grant WHOLESALE rather than merging it, so adding one
  # "to be explicit" silently drops scopes. The workflow-level contents: read (:9-10)
  # covers checkout plus an artifact download, and this job requests no secret.
  #
  # NO EVENT GATE. Every job in this file carrying `if: github.event_name == 'push'`
  # does so because it WRITES (seeds a cache entry, publishes a release asset). This
  # one only reads and asserts -- same rule the read-side jobs state at :170-172. A
  # gate that only runs on the default branch is not a gate on a pull request.
  #
  # CHECKOUT REF pinned to the PR head SHA, as in the capture job (see its CHECKOUT
  # REF paragraph at :525-535 for the full reasoning). The narrower reason HERE: the
  # records were captured from the branch tree, so the comparator that judges them
  # must be the branch's comparator. On a default merge-commit checkout, a clause
  # WEAKENED on the default branch would silently judge this branch's records -- a
  # false-green channel, since the merge tree can carry a removal the branch never
  # made.
  #
  # THE BUILD STEP IS MANDATORY and easy to forget: the comparator is TypeScript, so
  # dist/hash-parity/assert-parity.js does not exist until `npm run build` has run,
  # and without it the step fails for the wrong reason. pack-check (:121-131, reason
  # spelled out at :119-120) and publish-verify (:1043-1050) carry the same
  # build-then-run ordering.
  #
  # RECORDS DIRECTORY CREATED BEFORE THE DOWNLOAD, so the loader always has a
  # directory to read rather than an ENOENT, even when nothing arrived. RESIDUAL
  # LIMITATION, accepted and recorded rather than papered over: if the download
  # action ITSELF errors on a zero-match pattern, this job is still RED but the blame
  # lands one step earlier than the comparator's named `wrong-record-count` reason.
  # The fixture case for that clause is unit-proven regardless (08-02: a one-record
  # directory exits 1 naming `wrong-record-count` plus its three suspects), so the
  # clause is covered; only the blame location shifts.
  #
  # THE GREP IS REQUIRED ON TOP OF THE EXIT CODE (D-23), and it is not optional. The
  # pipeline's failure mode is the FIRST half -- a non-zero exit from the bin fails
  # the step under pipefail. The grep is the SECOND: it asserts the comparison
  # actually RAN and PRINTED its verdict, rather than the step succeeding because the
  # bin was absent, the directory was empty in a way the loader tolerated, or a future
  # refactor turned the assertion into a no-op. The `lint` job at :66-72 is the exact
  # precedent and its comment is this file's statement of the rule; Phase 7's
  # measurement that `nx run-many -t <missing>` prints "No tasks were run" and exits 0
  # is why the precedent exists. Unlike that job this one needs NO NO_COLOR: the
  # asserted prefix is the comparator's own literal (`SUCCESS_PREFIX` in
  # assert-parity.ts), deliberately colour-free and not Nx-formatted, so no reporter
  # change can break the match.
  #
  # THE `^` ANCHOR IS LOAD-BEARING, not tidiness, and calling this signal
  # INDEPENDENT is only true WITH it. Every failure detail the comparator prints
  # interpolates values the DOWNLOADED RECORD controls (a target key, meta.os, a
  # hash), and both streams are piped into the one log this grep reads. So a record
  # could carry the success prefix as record CONTENT and have the FAILURE path print
  # it: unanchored, it matches as a mid-line substring of the `PARITY FAILED` line,
  # and with a line break in the injected value it matches as a whole line. The
  # anchor closes the substring half -- the failure line begins `hash-parity: PARITY
  # FAILED`, so `^hash-parity: PARITY OK` cannot match it. The line-break half is
  # closed in code, at the single choke point `compare.ts:fail` documents, and pinned
  # by `compare.spec.ts`. NEITHER HALF SUFFICES ALONE; do not "simplify" either away.
  # Until both landed this signal was not independent at all -- the step was red only
  # because a non-zero exit under pipefail aborts before the grep runs, which is
  # exactly the exit-code-alone verdict D-23 forbids relying on.
  #
  # NO SPEC ASSERTS ON THIS FILE, so this comment block is the only place the
  # rationale can live -- which is why it carries so much of it. ci.yml is NOT in
  # nx.json's `test` inputs (only cleanup.yml is, nx.json:68), so a spec asserting on
  # this file's content would serve a stale cached PASS; registering it is PARITY-08,
  # deferred to Phase 9.
  hash-parity-compare:
    needs: hash-parity
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04-arm
    # Generic hang insurance -- see the build job. Matches the non-matrix siblings at
    # 15 rather than the capture matrix's 20: this job installs, builds, downloads two
    # small JSON files and runs one node script.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Create the records directory before the download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hash-parity-records
      - uses: actions/download-artifact@v8
        with:
          pattern: hash-parity-*
          merge-multiple: true
          path: hash-parity-records
      - name: Compare the two records, and prove the comparison actually ran
        shell: bash
        run: |
          set -euo pipefail
          node packages/github-cache/dist/hash-parity/assert-parity.js hash-parity-records 2>&1 | tee hash-parity.log
          grep -q '^hash-parity: PARITY OK' hash-parity.log

  # The dogfood-seed / dogfood-verify pair is this phase's LIVE proof that the
  # cache really works (ROADMAP SC5) and doubles as the upgrade canary for the
  # exact-pinned @actions/cache dependency (ROBUST-03): a version bump that changes
  # the archive version hash surfaces here as a failed verify job, not a silently
  # degraded cache. The round-trip is split across TWO jobs keyed on the workflow
  # run id because a same-run, same-process read-back can succeed from local state
  # while the upload never reached GitHub's cache service -- two jobs prove the
  # bytes actually crossed the service. The jobs deliberately drive a DIRECT
  # scripted PUT/GET through the internal action rather than real Nx cached tasks,
  # because a task runner short-circuits on its own local hit and would leave the
  # server inert behind a green result (Pitfall 6). NO job-level permission block is
  # added on purpose: the runtime cache credentials (injected only into a JS action)
  # are independent of the workflow token grant, and a job-level block would REPLACE
  # the workflow-level grant wholesale rather than extend it. Both jobs run ONLY on
  # the default-branch push trigger, because the write gate trusts no other trigger
  # (push/schedule only) and the read-only path is exhaustively unit-tested instead.
  # action.yml's main points into the build output, so each job builds first.
  dogfood-seed:
    # run id as the cache hash: unique per run and already all-decimal, so it
    # satisfies the server's ^[a-f0-9]{1,512}$ hash validator with no massaging.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - uses: ./packages/github-cache
        with:
          hash: ${{ github.run_id }}
          operation: seed
        env:
          # selectBackend hands back the writable Actions-cache backend only when a
          # token resolves (GH_TOKEN || GITHUB_TOKEN); pass it by process inheritance
          # into the action step, never through the workflow environment file (D-06).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dogfood-verify:
    # Reads back exactly what dogfood-seed wrote, keyed on the same run id, so a real
    # cross-job HIT is the only way this job passes; a MISS fails the job loudly. TWO
    # LEGS, and the Windows one is VER-06's whole proof: it restores a body a LINUX
    # runner produced, so a green windows-11-arm leg is the live evidence that an
    # Actions-cache entry saved on Linux is readable on Windows. The action compares
    # against the LITERAL 'linux' producer stamp folded into the payload bytes, so this
    # is a PROVENANCE check, not a presence check -- see action/index.ts's verify branch.
    # fail-fast off so a Windows-only failure never hides the ubuntu result.
    #
    # THE VACUITY CONDITION -- read this before adding a Windows dogfood-seed leg.
    # dogfood-seed is ubuntu-ONLY BY DESIGN and must stay that way. The seed key is
    # nx-cache-<GITHUB_RUN_ID>: ONE key per RUN, not per OS. So a Windows seed leg would
    # make the Windows verify leg restore a WINDOWS-written entry and pass even with
    # cross-OS restore completely dead -- the proof would go green while proving nothing.
    # If a Windows seed leg is ever genuinely wanted, the expected-producer literal in
    # action/index.ts's verify branch has to change in the same commit.
    # dogfood-cross-os.spec.ts asserts BOTH halves of this shape from disk (this job has
    # the two-leg matrix; dogfood-seed has no matrix) so neither can drift unnoticed.
    #
    # The ubuntu verify leg is KEPT rather than traded for the Windows one: it preserves
    # the v0.0.1 same-OS round-trip close instead of swapping one proof for another. Both
    # legs assert a LINUX-produced body -- trivially true for the ubuntu leg, and the
    # entire point for the Windows one.
    #
    # A GREEN dogfood-verify IS NOT ROBUST-04 EVIDENCE. Both dogfood jobs run
    # `uses: ./packages/github-cache`, whose dist/action/index.js is built from source
    # in-job, so they never execute the COMMITTED start-cache-server/index.js -- which is
    # what four of the five bundle sites actually run. action-bundle-drift (no `if:`, so
    # it runs on PRs too) is the only control tying the two together. The misreading is
    # natural, so it is recorded here where a reader will look.
    if: github.event_name == 'push'
    needs: dogfood-seed
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, windows-11-arm]
    runs-on: ${{ matrix.os }}
    # Generic hang insurance -- see the build job. Matches the `integration` job's value;
    # this job had none before it grew a matrix.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - uses: ./packages/github-cache
        with:
          hash: ${{ github.run_id }}
          operation: verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # DOCS-06 LIVE PROOF: the consumer background-step round-trip (a first-push live
  # close, like dogfood/ppe). It consumes the PUBLIC start-cache-server action
  # exactly as an adopter would -- pre-set the two NX_* vars in a REGULAR step,
  # then `uses: ./start-cache-server` with `background: true` and a matching
  # `port` -- then drives a scripted PUT+GET against the pre-set
  # NX_SELF_HOSTED_REMOTE_CACHE_SERVER using the pre-set token, proving the
  # loopback sidecar serves a real round-trip through the write-trusted
  # Actions-cache backend. The `cancel:` teardown is MANDATORY: the implicit
  # wait-all before post-job cleanup would otherwise hang forever on the
  # never-exiting serve (Pitfall 3); cancel sends SIGTERM -> serve() drains
  # in-flight puts (ROBUST-04) -> clean exit. Push-gated: the write gate trusts
  # push/schedule only. GITHUB_TOKEN is passed to the action step by process
  # inheritance (mirroring dogfood-seed) -- without it selectBackend degrades to
  # the read-only memory backend and the proof would exercise the WRONG backend
  # (D-06). No job-level permissions block: the workflow-default contents:read
  # plus the JS-action-only runtime cache creds suffice (T-06-01-05).
  #
  # HANDSHAKE: a background step cannot export env to later steps (its
  # exportVariable $GITHUB_ENV writes are only processed after the step COMPLETES,
  # which for a background step is its `cancel:` teardown). So the consumer sets
  # the two NX_* vars in the prior regular step below (whose $GITHUB_ENV writes DO
  # propagate) and passes the matching fixed port; serve() adopts both.
  consumer-smoke:
    if: github.event_name == 'push'
    # Depend on action-bundle-drift so a drifted committed bundle short-circuits
    # this job instead of being silently papered over by a fresh rebuild. This job
    # now runs the COMMITTED start-cache-server/index.js as-is (no build:action
    # step) -- exactly the artifact an adopter resolves from the git ref -- so the
    # smoke test proves the shipped bytes work, not that a rebuild does.
    needs: action-bundle-drift
    runs-on: ubuntu-24.04-arm
    # Generic hang insurance -- see the build job. Its scripted round-trip steps can
    # genuinely fail (the 200 status check, the payload cmp), and its bare `cancel:`
    # handles that correctly; this only bounds a true hang.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      # Pre-set the Nx client vars HERE, in a regular step: a background step
      # cannot export env to later steps, but this step's $GITHUB_ENV writes do
      # propagate. The sidecar below adopts the pre-set token + matching port.
      - name: Pre-set the Nx cache client vars for the sidecar
        run: |
          set -euo pipefail
          echo "NX_SELF_HOSTED_REMOTE_CACHE_SERVER=http://127.0.0.1:3000" >> "$GITHUB_ENV"
          # Mask the bearer token BEFORE writing it to $GITHUB_ENV. entry.ts's
          # core.setSecret runs far too late -- it only redacts once the action
          # step starts, so anything echoing the value between here and there would
          # land unredacted. ::add-mask:: redacts from the moment it is processed.
          # node, not openssl -- same reasoning as the build job (see :179-182).
          token="$(node -e 'process.stdout.write(require("crypto").randomBytes(32).toString("hex"))')"
          echo "::add-mask::${token}"
          echo "NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN=${token}" >> "$GITHUB_ENV"
      - uses: ./start-cache-server
        id: cache-server
        background: true
        with:
          port: '3000'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Nx cache round-trip over the loopback sidecar
        env:
          # `cafe` prefix keeps the key valid hex (^[a-f0-9]+$) yet DISTINCT from the
          # dogfood-seed / publish `nx-cache-<run_id>` key. All three ubuntu jobs share
          # this run's Actions-cache scope; a bare run_id collides -- this job's PUT
          # would land in the very key dogfood-verify reads back (Actions cache is
          # first-write-wins), returning consumer-smoke's payload as wrong data.
          RUN_HASH: cafe${{ github.run_id }}
        run: |
          set -euo pipefail
          server="${NX_SELF_HOSTED_REMOTE_CACHE_SERVER:?NX_SELF_HOSTED_REMOTE_CACHE_SERVER not set (pre-set regular step missing?)}"
          token="${NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN:?NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN not set (pre-set regular step missing?)}"
          auth="Authorization: Bearer ${token}"
          # Wait for the loopback sidecar to accept connections: an authed GET on
          # an unknown hash returns 404 (up). On connection-refused, curl's -w
          # already prints 000 and exits non-zero, so swallow the exit with `|| true`
          # -- NOT `|| echo 000`, which appends a second 000 so code becomes "000000"
          # (!= "000") and breaks the poll on iteration 1 before the server binds.
          code=000
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "${auth}" "${server}/v1/cache/deadbeef" || true)
            if [ "${code}" != "000" ]; then
              break
            fi
            sleep 1
          done
          if [ "${code}" = "000" ]; then
            echo "sidecar never accepted connections on ${server} after 30s" >&2
            exit 1
          fi
          # PUT a payload keyed on the run id (all-decimal -> valid ^[a-f0-9]+$),
          # then read it back and byte-compare: a real round-trip through the
          # write-trusted Actions-cache backend.
          printf 'consumer-smoke-%s' "${RUN_HASH}" > payload.bin
          put=$(curl -s -o /dev/null -w '%{http_code}' -X PUT --data-binary @payload.bin -H "${auth}" "${server}/v1/cache/${RUN_HASH}")
          test "${put}" = "200"
          curl -fsS -H "${auth}" "${server}/v1/cache/${RUN_HASH}" -o roundtrip.bin
          cmp payload.bin roundtrip.bin
          echo "[OK] consumer sidecar round-trip: PUT 200 + GET byte-match on ${RUN_HASH}"
      - cancel: cache-server

  # The per-OS publish matrix is this phase's LIVE mirror path (D-03, TRUST-02): on a
  # default-branch push each leg enumerates the default-branch Actions-cache entries via
  # getActionsCacheList, restores the nx-cache-* ones, and uploads them to the current
  # month-shard GitHub Release. The matrix is LOAD-BEARING but it
  # is no longer SELF-ENFORCING at the storage layer: @actions/cache still folds the
  # compression method into the cache version hash unconditionally (cacheUtils.js:162-163),
  # but from VER-01/VER-03 the archive path is workspace-relative and enableCrossOsArchive
  # suppresses the windows-only salt, so an ubuntu leg CAN now restore a Windows-saved entry.
  # The reason to keep both legs is now the Nx HASH, not the store: the Windows leg is still
  # the ONLY leg that produces Windows-hash entries at all, because the integration and
  # hash-parity platform discriminator keeps those task hashes distinct. So collapsing this to
  # one OS STILL SILENTLY drops the other OS's entries (D-03) -- now because those tasks never
  # RUN there, rather than because the store partitions -- keep BOTH legs; fail-fast
  # off so a Windows-only failure never hides the ubuntu result. It runs as `operation: publish`
  # on the node24 JS action, NOT a `run: node` step, because @actions/cache restoreCache needs
  # the JS-action-only ACTIONS_RUNTIME_TOKEN/ACTIONS_RESULTS_URL runtime (a plain run: step
  # silently MISSes -- verified Phase 2). if: !cancelled() && push -- the mirror runs only on the
  # trusted push trigger, and isSyncTrusted re-checks the default branch in-process as the
  # load-bearing gate (D-01), not the workflow if: alone.
  #
  # WHY needs: [build, typecheck, test, integration] and not the needs: build it replaced
  # (XOS-07). The comment that stood here argued for `needs: build (NOT test)` so that a failing
  # test leg could never skip the mirror and drop already-built entries. That concern is STILL
  # REAL -- it is stated here rather than deleted, so nobody reconstructs it from scratch and
  # narrows needs: straight back. It is simply no longer what needs: has to carry, because a
  # different mechanism already covers it:
  #   MECHANISM: !cancelled() runs this job even when a needs: dependency FAILED.
  # GitHub documents that a job whose if: expression causes it to continue is NOT skipped when a
  # needs: dependency fails -- the FAILED case, not merely the skipped one -- so a red test leg
  # does not skip the mirror under the wide list.
  #   BOUNDED FAILURE MODE: a skipped mirror, never a wrong artifact.
  # Named because that !cancelled()-past-a-FAILED-needs: behaviour is CITED from GitHub's docs
  # and has never been reproduced in this repo (no run on record has a failed publish ancestor).
  # If the citation is wrong or the semantics change, publish is SKIPPED on a red-test push and
  # that push's entries simply stay in the Actions cache until the next green push mirrors them.
  # A recoverable GAP, never a wrong artifact reaching the world-readable mirror. That is the
  # whole trade, and an operator diagnosing a missing mirror should find the cause written here.
  #   MEASURED on run 30400231720, which is why this widening is a fix and not a precaution:
  #   publish (ubuntu-24.04-arm) enumerated the Actions cache about 122 seconds BEFORE
  #   integration (windows-11-arm) finished, so the Windows integration entry did not exist yet
  #   when the enumeration snapshot was taken -- and the shard carries the fingerprint, task
  #   hash 8059758544828235640 present ONLY under a -windows suffix. Each leg's view of the
  #   Actions-cache key set is ONE listCacheEntries() call taken at that leg's publish step
  #   start and is never re-read (the `const entries` line in publish-mirror.ts), so what a leg
  #   can mirror is a function of its START TIME. Waiting on every producer is what makes one
  #   default-branch push mirror that push's full task set instead of racing job completion.
  #   WALL CLOCK: publish used to start ~40s into the run; it now waits for integration
  #   (windows-11-arm), roughly 3 minutes. Acceptable for a push-only background mirror job.
  #   DOWNSTREAM, and it changes which pushes sample OBS-05: publish-verify carries
  #   if: github.event_name == 'push' with NO !cancelled(), so it is skipped whenever publish
  #   FAILS. The wide list makes publish run on a red-test push, so publish-verify now runs
  #   there too. Desirable, and named here rather than discovered.
  publish:
    if: ${{ !cancelled() && github.event_name == 'push' }}
    needs: [build, typecheck, test, integration]
    strategy:
      fail-fast: false
      # max-parallel 1 serializes the OS legs (WR-01). Run concurrently, each leg
      # snapshots the shard's asset count once and caches it for the rest of its run,
      # so both legs can observe the shard at 999 and both pass the soft 1000-asset cap
      # check, pushing it to 1001 -- one past the documented cap. Serializing makes the
      # later leg's listReleaseAssets see the earlier leg's uploads, so its cap check is
      # accurate. Per-OS isolation is unchanged (each leg still runs on its own OS and
      # mirrors only the entries IT can restore); the only cost is a little wall-clock on
      # this push-only background mirror job. fail-fast stays off so a Windows-only
      # failure never hides the ubuntu result.
      #
      # THIS KNOB IS NOT a correctness control (XOS-06). No requirement may depend on
      # which OS leg wins the first-write-wins race, and the reason is mechanical rather
      # than a policy preference: for a given hash both legs restore the SAME single
      # Actions-cache entry and upload it VERBATIM without re-executing the task
      # (TRUST-11), so whichever leg wins, every reader receives identical bytes. What a
      # served artifact's correctness DOES rest on is CORR-05's target platform-agnosticism.
      #
      # REJECTED ARGUMENT: ubuntu-first ordering makes the stricter Linux verdict win.
      # Named so a future reader does not reconstruct it and quietly promote this knob into
      # a correctness control. It is rejected because it would rest a WRONG-RESULT
      # guarantee on CI job scheduling -- read PROJECT.md's Key Decisions row (cross-OS
      # sharing rests on target platform-agnosticism, NEVER on publish-leg ordering) and
      # XOS-06 in REQUIREMENTS.md rather than this loose restatement of them.
      #
      # THE ONE THING THAT DOES DEPEND ON THIS KNOB is publish-verify's ability to DETECT a
      # dead publish leg -- see read-back.ts, which reads the mirrored-by label of the
      # asset its own leg seeded. That check needs the two legs NOT TO OVERLAP: run them
      # concurrently and the other leg can win the upload race for this leg's seed asset,
      # so removing max-parallel: 1 would redden publish-verify on a CORRECT
      # implementation. That is guard sensitivity, not a wrong-result guarantee, and the
      # two must never be conflated -- a lost guard means a real defect goes unnoticed, not
      # that a wrong artifact reaches a developer. Naming the coupling is deliberate: a
      # tripwire that fires on correct work gets disabled, and OBS-04 is this repo's own
      # record of that. The distinction is written in BOTH places so neither comment reads
      # as contradicting the other.
      #   The leg ORDER, by contrast, is relied on NOWHERE, and that is the point of the
      #   label assertion. It was MEASURED 5/5 across the default-branch push runs on
      #   record, margins 150-190 seconds (run 30401077417: publish (ubuntu-24.04-arm)
      #   step 7 ends 2026-07-28T21:33:39Z, publish (windows-11-arm) step 6 starts
      #   21:36:32Z). A measurement is not a documented guarantee: GitHub documents matrix
      #   CREATION order only, names runner availability as a scheduling input, and these
      #   two legs draw from DIFFERENT hosted runner pools, so per-leg availability is an
      #   independent variable. read-back.ts's label assertion is what replaced that
      #   ordering dependency with the non-overlap one above.
      max-parallel: 1
      matrix:
        os: [ubuntu-24.04-arm, windows-11-arm]
    runs-on: ${{ matrix.os }}
    # A job-level permissions block REPLACES the workflow grant (contents: read) WHOLESALE --
    # it does NOT merge. So this block MUST restate BOTH scopes: contents: write (create the
    # month-shard release + upload assets) AND actions: read (getActionsCacheList; omitting it
    # 404s the cache enumeration -- Pitfall 3). Least-privilege: exactly these two, nothing more.
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      # Seed a known entry keyed on a seed only THIS leg can produce, so each OS leg has
      # a DETERMINISTIC entry to mirror -- and so the live cross-OS round-trip has a
      # producer: publish-verify reads that same derived seed back through the real
      # Releases reader below (the leg deferred from Phase 3). Seed runs as a JS-action
      # operation for the same reason publish does (the Actions-cache runtime is
      # JS-action-only).
      #
      # `operation: mirror-seed`, NOT `seed`, and the two are deliberately separate verbs
      # (OBS-05, D-13). `seed` writes ONE key per RUN, which dogfood-seed/dogfood-verify
      # REQUIRE -- seeding that shared key per OS is exactly the vacuity trap VER-06
      # closed. This job needs the opposite: a key only this leg can produce, so a
      # publish-verify leg that finds its own seed proves its OWN publish path ran.
      #
      # `hash:` STAYS `${{ github.run_id }}` and that is load-bearing (D-14). The per-leg
      # derivation happens in TypeScript, at BOTH call sites, from the ONE helper
      # mirrorSeedHash in packages/github-cache/src/lib/mirror-seed.ts -- the mirror-seed
      # operation writes it and roundtrip/read-back.ts reads it back. A per-leg
      # `${{ matrix.os == 'windows-11-arm' && 'x' || 'y' }}` expression here would put the
      # OS mapping in TWO languages, which is the drift class this repo guards against
      # everywhere else: YAML cannot import the tuple, so the two mappings would be free
      # to disagree and the symptom would be a SILENT publish-verify MISS.
      #
      # The seeds are NO LONGER the only nx-cache-* entries in play. build, typecheck,
      # test and integration now route their real Nx tasks through the sidecar, so a
      # default-branch push writes real `nx-cache-<taskhash>` entries too -- and those
      # pass isServerProducedKey, so getActionsCacheList enumerates them and this job
      # MIRRORS REAL TASK ARTIFACTS to the month shard. That is the intended dogfooding
      # outcome and is deliberately ACCEPTED here (the Releases mirror now holds real
      # task outputs, which is the whole point of a remote cache), with two consequences:
      #
      #   (a) Shard growth, and Phase 9 DOUBLED it. There are ~5 distinct real task
      #       hashes per input-changing push (build, typecheck, test, integration-linux,
      #       integration-win32). This estimate used to read 4 from the ubuntu leg plus 1
      #       from the windows leg, because each leg could restore ONLY its own OS's
      #       saves. VER-01 + VER-03 removed that partition, so EACH leg now restores all
      #       ~5 and uploads them under its OWN `<hash>-<os>` suffix -- ~10 real assets
      #       per push, not ~5, on top of the ~3 run_id-keyed ones. So roughly 75
      #       default-branch pushes inside ONE calendar month before that month's shard
      #       reaches RELEASE_ASSET_CAP, down from ~125 -- and the cap already degrades to
      #       skip-and-warn (D-11), never a hard failure, while retention prunes shards
      #       past the window. Still not a concern at this repo's push rate. The duplicate
      #       pair per hash is the same accepted cost OBS-05 owns (a leg's asset suffix
      #       names the PUBLISHING leg, not the producer).
      #   (b) Wall clock. Uploads are throttled to ~1/sec, so publish gains a few
      #       seconds per push.
      #
      # SECURITY PROPERTY this now depends on: an Nx cache entry contains the task's
      # captured TERMINAL OUTPUT as well as its outputs, and `::add-mask::` redacts
      # LOGS ONLY -- never a cache payload. So what keeps this PUBLIC Releases mirror
      # safe is the invariant "no mirrored task ever prints a secret", NOT masking.
      # It holds today (build/typecheck/test/integration receive no secret), but it is
      # now a property of this wiring rather than an accident -- and these four jobs
      # are the reference implementation adopters copy. Never route a task that prints
      # a credential through the sidecar on a public repo.
      #
      # ALTERNATIVE, if shard growth ever does become a problem: scope this job to the
      # run_id seed only (filter the enumeration down to the seeded key) and let the
      # real task entries live in the Actions cache alone. Not done now -- it would
      # throw away the real cross-context mirror this change exists to prove.
      #
      # Key namespaces stay disjoint, but NOT for the reason one might assume: real Nx
      # task hashes here are ALL-DECIMAL 18-20 digits (Nx renders a 64-bit hash as a
      # decimal string; verified over 153 local cache entries, zero containing a-f), so
      # they are the same character class as a run id, not a contrasting hex. What keeps
      # them apart is numeric range plus construction: a run id is ~11 digits, and
      # `cafe<run_id>` is not all-decimal at all so it can never equal a task hash.
      # A `nx-cache-<run_id>` collision would need a 64-bit task hash whose decimal form
      # exactly equals THIS run's id -- about 1 in 1.8e19 per task. Negligible.
      - uses: ./packages/github-cache
        with:
          hash: ${{ github.run_id }}
          operation: mirror-seed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./packages/github-cache
        with:
          operation: publish
        env:
          # Token by process inheritance into the action step (D-06), never through the
          # workflow environment file. resolveGitHubToken reads GH_TOKEN || GITHUB_TOKEN.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The live cross-OS publish/read-back round-trip (the leg deferred from Phase 3). It
  # runs after the WHOLE publish matrix and, per OS, resolves the entry that leg itself
  # seeded THROUGH THE REAL GitHub Releases reader -- invoked DIRECTLY
  # (createReleasesReadBackend(createReleasesReadClient(process.env)) in read-back.ts),
  # NOT selectBackend, which in a push (write-trusted) context returns the writable
  # Actions-cache backend rather than the reader (TRUST-05).
  #   WHAT IT PROVES, AND WHY THE OLD REASON IS GONE (D-21). Each OS leg still reads back
  #   ONLY the asset its own leg seeded -- but the mechanism is a per-leg SEED derivation,
  #   NOT a per-leg asset name. The key is mirrorSeedHash(github.run_id, that leg's OS) and
  #   the asset is releaseAssetName(mirrorSeedHash(...)), so the separation lives in the KEY
  #   and survives CORR-02 collapsing the OS out of the name. The old justification was the
  #   name's own -os suffix, which that rename deletes outright.
  #   IT DOES NOT PROVE A SAME-OS PUBLISHER-TO-READER CONTRACT. That claim stood here until
  #   Phase 10 and was flatly false by then: VER-01 + VER-03 made cross-OS restore work, so
  #   a leg can mirror bytes produced on another OS entirely. What this job proves instead
  #   is that each leg's OWN publish path uploaded the asset that leg reads back, evidenced
  #   by the mirrored-by label read-back.ts asserts -- a PUBLISHER identity, never a
  #   producer identity. Different axes; only the label carries the second, which is why
  #   the byte comparison alone cannot detect a dead publish leg.
  #   WHY THE STALE CLAIM SURVIVED: Phase 9's same-OS sweep was scoped to DOCUMENTATION and
  #   missed read-back.ts's own comment plus a ci.yml capacity comment, both found only
  #   after that sweep had declared itself complete. A same-OS-invariant sweep must
  #   enumerate EXECUTABLE CODE and CI PROSE, not only docs.
  # It exercises the 04-02 shard-window walk live. The reader is native fetch (no
  # ACTIONS_RUNTIME_TOKEN), so this is a plain `node` step, not a JS action. It needs only
  # the workflow-default contents: read -- for the asset download and for the release and
  # asset-listing reads the label check makes -- so it adds NO job-level permissions block
  # and never touches the write gate. Mirrors the dogfood-verify shape: push-gated, needs
  # the producer, a MISS fails the job loud (the reader swallows faults to a MISS, so any
  # MISS is a round-trip failure).
  publish-verify:
    if: github.event_name == 'push'
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: node packages/github-cache/dist/roundtrip/read-back.js
        env:
          # The reader resolves its token from GH_TOKEN || GITHUB_TOKEN (tier 1) and the
          # repo from GITHUB_REPOSITORY (runner-injected); GITHUB_RUN_ID is the hash.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
