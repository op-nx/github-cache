name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Supersede an in-flight run only when a NEWER commit lands on the SAME pull request.
# This workflow fans out to twenty-two jobs, three of which are multi-minute Windows-arm
# legs, so a rapid re-push otherwise pays for the whole matrix twice with the first copy
# already obsolete.
#
# `cancel-in-progress` IS CONDITIONAL, and the condition is the load-bearing part. On a
# `push` to main this workflow WRITES: `publish` uploads Release assets and `dogfood-seed`
# PUTs a cache entry. Cancelling one of those mid-upload is how a shard acquires a
# zero-byte asset under a name a reader will resolve and a publisher will never overwrite
# -- first-write-wins arbitration is keyed on the FILENAME, so a torn asset is permanent
# until the retention window rolls it off. Push runs therefore queue rather than cancel;
# only pull-request runs, which write nothing outside their own merge-ref cache scope,
# are superseded.
#
# READ THAT ENUMERATION PRECISELY: since CR-18, `dogfood-seed` PUTs on same-repo PR runs
# too, so the cancellable runs are exactly the ones that now perform that PUT. It is safe,
# and the reason is recorded here rather than left to be re-derived: the seed key is
# nx-cache-<GITHUB_RUN_ID>, so a torn PR-side upload leaves at most an absent entry under
# a run id that is never reused. There is no first-write-wins filename arbitration to
# poison -- that hazard belongs to the Release-asset uploads, which stay push-only.
#
# The group is keyed on `github.ref` so the two event kinds cannot share a group either.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format-check:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      # --all: pull_request checkouts don't have a local `main` ref for Nx's
      # default git-diff base, so diff-based format:check always fails here.
      - run: npx nx format:check --all

  # `nx run-many -t lint` gates every project against the root flat ESLint
  # config -- the two recommended sets plus the ambient-platform-read ban that
  # keeps unit specs from branching on process.platform, which is what makes a
  # unit spec's result the same on both runners (LINT-01, LINT-02, CORR-06).
  # Kept a distinct named job like format-check and fallow so a lint regression
  # surfaces as a red `lint` leg instead of inside the build/test battery, and
  # so it still runs when an earlier gate fails. No background sidecar block: it
  # runs in seconds, and a fifth cache producer would add a fifth mirrored hash
  # family to the cross-OS investigation this milestone exists for (D-33). No
  # build step either -- lint has no dependsOn, and the config's global ignores
  # block exists precisely so lint output does not depend on whether build ran.
  lint:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      # Exit 0 is NOT sufficient here, and that is the whole reason this is a
      # scripted step rather than `- run: npm run lint`. `npm run lint` is
      # `nx run-many -t lint`, and run-many with no matching target ANYWHERE
      # prints "NX No tasks were run" and exits 0 (measured). The `lint` target
      # is INFERRED by @nx/eslint/plugin (D-01) rather than declared, and D-35
      # leaves "does @nx/eslint infer lint identically on both OSes?" UNVERIFIED
      # BY DESIGN -- so "the target exists on this runner" is a live accepted
      # risk, and a bare exit-code check converts it into a GREEN leg instead of
      # a red one. Demanding the success LINE is RESEARCH's named discriminator
      # for LINT-01: it prints only when a task actually ran.
      #
      # NO_COLOR is load-bearing, not tidiness. With colour on, Nx bolds the
      # target name mid-phrase -- "ran target <esc>[1mlint<esc>[22m for project"
      # -- so the plain-text match never fires and the check fails on every run
      # including the good ones. A gate that always fails gets deleted just as
      # fast as one that never fires.
      #
      # The other half of CR-01 (nx.json silently losing the plugins[] entry) is
      # guarded locally by nx-target-inputs.spec.ts; this leg is what catches the
      # target failing to materialise on a RUNNER rather than in the config.
      - name: Lint, and prove the lint target actually ran
        env:
          NO_COLOR: '1'
        run: |
          set -euo pipefail
          npm run lint 2>&1 | tee lint.log
          grep -q 'Successfully ran target lint' lint.log

  # `fallow dead-code --fail-on-issues` gates the whole repo against dead code
  # (unused files/exports/deps + reachability). It is config-declared-clean via
  # .fallowrc.jsonc and base-independent, so it works identically on push and on
  # shallow pull_request checkouts -- unlike `fallow audit`, which needs an
  # origin/main diff base and fails open (exits 0) when that ref is absent.
  # Future option: `fallow audit --changed-since origin/main` for faster,
  # diff-scoped gating once the repo grows large enough to want it.
  fallow:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      - run: npm run fallow:ci

  # The consumer-action bundle drift guard (DOCS-06, Pitfall 1). A `uses:` action
  # resolves start-cache-server/index.js from the git ref -- never from npm, never
  # after a build -- so the committed esbuild bundle must stay in sync with
  # entry.ts and its inlined deps. check:action rebuilds it with the exact-pinned
  # esbuild and byte-diffs the committed file, exiting non-zero on staleness or a
  # hand edit. Kept a distinct
  # named job so a drift surfaces as a red action-bundle-drift job.
  action-bundle-drift:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      - run: npm run check:action
      # Type-check the committed bundle's whole esbuild-reachable graph via the
      # root tsconfig.action.json (entry.ts lives outside the package tsconfig, so
      # it otherwise ships in the bundle with zero type checking). This job already
      # owns "the committed bundle is correct", so the typecheck belongs here rather
      # than a new job. noEmit, so it never touches the bundle or the drift diff.
      - run: npm run typecheck:action

  # The npm tarball file-list guard (DOCS-06 / GOV-02, A1, Pitfall 2). Proves
  # files:["dist"] ships ONLY dist/ + LICENSE + README.md + package.json and
  # excludes every src/CI/dogfood internal (dogfood-stays-local, T-06-01-01). It
  # needs dist built first because the tarball includes the build output, so it
  # runs npm run build before the guard. Dependency-free node guard; distinct job.
  pack-check:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run pack:check

  # Advisory PPE-hygiene dogfood (TRUST-06 / D-12). Runs the shipped composite
  # action (ppe/action.yml) against a KNOWN-unsafe fixture workflow to prove it
  # self-installs exact-pinned zizmor + actionlint and emits findings. ADVISORY
  # only: the action runs its tools non-failing (zizmor --no-exit-codes,
  # actionlint exit swallowed), so findings surface as annotations, NEVER a gate
  # -- containment stays the sync gate + default-branch protection, never this
  # job. It targets ppe/fixtures/unsafe-workflow.yml (deliberately outside
  # .github/workflows so GitHub never runs it). Kept a distinct named job (like
  # fallow) separate from the typecheck/test battery. Its
  # "produces findings" behavior is the first-push live close for TRUST-06
  # (expect a human_needed/live confirm on the CI run).
  ppe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./ppe
        with:
          path: ppe/fixtures/unsafe-workflow.yml

  # DOGFOOD (the real one): build / typecheck / test / integration run this repo's
  # OWN cacheable Nx tasks through the shipped ./start-cache-server loopback
  # sidecar, so CI produces real CROSS-RUN remote cache hits for real workloads --
  # not just the same-run, run_id-keyed proof jobs (dogfood-*, consumer-smoke,
  # publish, which drive scripted PUT/GETs instead). The block below is the
  # consumer-smoke pattern verbatim and is repeated IDENTICALLY in all four jobs:
  # pre-set the two NX_* vars in a REGULAR step, start the sidecar as a background
  # step, poll it, run the target, cancel:. Load-bearing details, all four jobs:
  #
  #   * GITHUB_TOKEN by process inheritance into the sidecar step (never via the
  #     workflow environment file, D-06). Without a resolvable token selectBackend
  #     degrades to the empty in-memory backend and the job caches NOTHING. Passed
  #     on pull_request too: selectBackend returns the WRITABLE Actions-cache
  #     backend there as well (pull_request is host-gated-trusted on github.com).
  #     Read-only on PRs is enforced by GitHub's PLATFORM -- cache scope isolation
  #     (a PR write lands in the PR ref's scope, invisible to the default branch)
  #     -- NOT by this code. The restriction is on the DEFAULT BRANCH'S SCOPE and
  #     never on a run's own writes: GitHub documents that only high-trust triggers
  #     can create or overwrite caches IN THE DEFAULT BRANCH'S SCOPE, while a
  #     pull_request run -- fork included -- still CREATES its cache, in the merge
  #     ref (refs/pull/.../merge).
  #       CORRECTED. This clause used to end "plus the read-only-cache token for
  #     untrusted triggers, whose saveCache no-ops through the backend's benign 409
  #     path", which dropped the scope qualifier and turned CONTAINMENT into DENIAL
  #     -- contradicting the scope-isolation half of its own sentence, and implying
  #     the integration job's 200-only positive control must redden on every fork
  #     PR. It does not: that probe reads the same merge-ref scope its own save just
  #     wrote. Dropping the qualifier is an easy misreading, which is why the
  #     qualifier is now spelled in capitals rather than assumed.
  #       CITED from GitHub's docs, not reproduced here -- this repo has had no fork
  #     PR on record. Same standing, and the same caveat, as the !cancelled()-past-a-
  #     FAILED-needs citation on the publish job.
  #   * NOT push-gated -- like the dogfood proof pair since CR-18, and unlike the
  #     publish pair: push runs WRITE the entries, PR runs READ the default-branch
  #     ones. `if: github.event_name == 'push'` here would throw away the whole PR
  #     read benefit.
  #   * The NX_* vars stay strictly per-job. Hoisting them to workflow `env:` would
  #     point every sidecar-less proof job at a dead server, so each of their Nx
  #     invocations would try (and fail) to reach 127.0.0.1:3000.
  #   * `cancel: cache-server` is MANDATORY (Pitfall 3). All three facts below were
  #     MEASURED here first: when they were established, the keywords shipped
  #     documented only in the 2026-06-25 changelog
  #     (https://github.blog/changelog/2026-06-25-actions-steps-can-now-be-run-in-parallel).
  #     The workflow-syntax reference has since documented the whole family
  #     (background:/wait:/wait-all:/cancel:/parallel:, corroborated 2026-07-26) and
  #     independently confirms all three, so they are now citable as well as measured.
  #     - OMIT it and the job hangs. Run 30172888579, probe with a background
  #       sidecar, a SUCCEEDING target and no cancel: -- the runner inserted a step
  #       literally named "Wait for all background steps", which never returned; the
  #       job died at its timeout-minutes cap (3m02s, conclusion cancelled). The
  #       implicit wait-all is real, and it is why timeout-minutes is worth keeping.
  #     - It does NOT need `if:` or a continue-on-error dance to survive a FAILING
  #       target. Run 30172032003: a probe with a failing step and a bare `cancel:`
  #       ran the cancel (conclusion success), tore the sidecar down, and went red in
  #       8 seconds. A cancel: step is not subject to skip-on-failure.
  #     - `if:` is REJECTED on a cancel: step: the runner refuses to parse the
  #       workflow ("Unexpected value 'if'", run 30171349564, no jobs scheduled).
  #   * `shell: bash` on both shell steps -- redundant on ubuntu, REQUIRED on the
  #     integration matrix's windows-11-arm leg (default there is pwsh, which fails
  #     on $GITHUB_ENV / $(...) / seq / [ ... ]). One block, not two variants.
  #
  # port 3000 is reused across all four jobs: Actions jobs get isolated runners, so
  # it is one sidecar per job and there is no clash. No chicken-and-egg in the
  # build job either -- a `uses:` action resolves the COMMITTED, drift-guarded
  # index.js bundle from the git ref, never from a build output.
  #
  # Latency note: each target is a single Nx task on this 1-project workspace, so
  # expect net-neutral-to-slightly-slower wall clock (sidecar start + poll + a
  # loopback GET/PUT + @actions/cache round-trips). Proving the shipped consumer
  # surface works on real tasks is the point; speed is not.
  build:
    runs-on: ubuntu-24.04-arm
    # Generic hang insurance, NOT a teardown workaround. `cancel:` needs no help:
    # a cancel: step is NOT subject to skip-on-failure -- measured on run
    # 30172032003, where a probe job with a failing step and a bare `cancel:` ran
    # the cancel (conclusion success), tore the sidecar down, and went red in 8s.
    # README.md:84's hang warning is about OMITTING cancel:, which is a different
    # thing. This bound only caps a genuine hang (a stalled npm ci, a wedged
    # vitest) at minutes instead of the 360-minute default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      - name: Pre-set the Nx cache client vars for the sidecar
        shell: bash
        run: |
          set -euo pipefail
          echo "NX_SELF_HOSTED_REMOTE_CACHE_SERVER=http://127.0.0.1:3000" >> "$GITHUB_ENV"
          # node, not openssl: openssl may be absent from the Windows runner's Git
          # Bash, while node is guaranteed present after setup-node. Mask BEFORE
          # the $GITHUB_ENV write -- entry.ts's core.setSecret only redacts once
          # the action step starts, far too late for anything echoed before that.
          token="$(node -e 'process.stdout.write(require("crypto").randomBytes(32).toString("hex"))')"
          echo "::add-mask::${token}"
          echo "NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN=${token}" >> "$GITHUB_ENV"
      - uses: ./start-cache-server
        id: cache-server
        background: true
        with:
          port: '3000'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for the loopback sidecar
        shell: bash
        run: |
          set -euo pipefail
          auth="Authorization: Bearer ${NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN}"
          code=000
          for _ in $(seq 1 30); do
            # Demand exactly 404: an authed GET on an unknown hash MISSes, and
            # every backend selectBackend can return answers it that way (Actions
            # cache, Releases reader, read-only memory alike). Accepting "any status
            # but 000" would pass a 401 -- i.e. a token-handshake mismatch, the one
            # failure this poll is best placed to catch -- after which every Nx
            # request 401s, best-effort read degradation kicks in, and the job goes
            # GREEN having cached nothing. 404 proves reachability AND auth, and also
            # rejects a squatter process on port 3000 answering with its own status.
            # 200 is the only other legitimate answer -- it needs a pre-existing
            # nx-cache-deadbeef entry, which nothing here creates, but it proves
            # reachability and auth just as well, so accept it rather than hard-fail
            # a job over it.
            # On connection-refused curl's -w already prints 000 and exits non-zero,
            # so swallow the exit with `|| true` -- NEVER `|| echo 000`, which
            # appends a second 000 and makes the status unparseable.
            # --max-time bounds EACH ATTEMPT at 10s (previously a hung response was
            # unbounded). Note the loop's worst case is therefore 30 x (10 + 1) =
            # ~5.5 min, NOT 30s -- still well under this job's timeout-minutes.
            code=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' -H "${auth}" "${NX_SELF_HOSTED_REMOTE_CACHE_SERVER}/v1/cache/deadbeef" || true)
            if [ "${code}" = "404" ] || [ "${code}" = "200" ]; then
              break
            fi
            sleep 1
          done
          if [ "${code}" != "404" ] && [ "${code}" != "200" ]; then
            echo "sidecar not ready on ${NX_SELF_HOSTED_REMOTE_CACHE_SERVER} after 30 attempts (last status ${code}, wanted 404 or 200)" >&2
            exit 1
          fi
      - run: npm run build
      - cancel: cache-server

  typecheck:
    runs-on: ubuntu-24.04-arm
    # Generic hang insurance -- see the build job.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      # Sidecar dogfood block. Rationale, and the traps it avoids, are documented
      # once above the build job (whose copy also carries the inline trap notes).
      # The EXECUTABLE shell must stay identical across all seven wired jobs --
      # build, typecheck, test, integration, build-windows, typecheck-windows and
      # test-windows -- only the final `npm run <target>` line may differ, and only
      # build's copy carries extra comments. Keep it that way, so the windows-11-arm
      # legs never drift from the ubuntu producers they exist to reuse.
      #
      # SEVEN WIRED JOBS, EIGHT COPIES, and those are two different sets on purpose.
      # The step occurs EIGHT times in this file; the eighth copy is in
      # `consumer-smoke`, which drives a scripted PUT/GET rather than an Nx target and
      # is deliberately OUTSIDE this invariant. (MEASURED before Phase 12: five copies,
      # four wired. XOS-04 added three legs, so both counts moved by three.) A note
      # saying "five become eight" without that distinction is describing a different
      # set than the invariant governs. Do not weaken the invariant to accommodate the
      # three new copies.
      #
      # This is an unguarded invariant: nothing fails
      # if it drifts. CORRECTED, and the replacement fact rather than a bare deletion:
      # this note used to say ci.yml was NOT in nx.json's test inputs, so such a guard
      # would first need it registered there. PARITY-08 registered it in
      # targetDefaults.test.inputs, and
      # dogfood-cross-os.spec.ts and docs-same-os-claims.spec.ts now both assert on this
      # file, so the precondition is already met -- only the drift guard itself would be
      # new work. cleanup-workflow.spec.ts remains the precedent for the shape.
      - name: Pre-set the Nx cache client vars for the sidecar
        shell: bash
        run: |
          set -euo pipefail
          echo "NX_SELF_HOSTED_REMOTE_CACHE_SERVER=http://127.0.0.1:3000" >> "$GITHUB_ENV"
          token="$(node -e 'process.stdout.write(require("crypto").randomBytes(32).toString("hex"))')"
          echo "::add-mask::${token}"
          echo "NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN=${token}" >> "$GITHUB_ENV"
      - uses: ./start-cache-server
        id: cache-server
        background: true
        with:
          port: '3000'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for the loopback sidecar
        shell: bash
        run: |
          set -euo pipefail
          auth="Authorization: Bearer ${NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN}"
          code=000
          for _ in $(seq 1 30); do
            code=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' -H "${auth}" "${NX_SELF_HOSTED_REMOTE_CACHE_SERVER}/v1/cache/deadbeef" || true)
            if [ "${code}" = "404" ] || [ "${code}" = "200" ]; then
              break
            fi
            sleep 1
          done
          if [ "${code}" != "404" ] && [ "${code}" != "200" ]; then
            echo "sidecar not ready on ${NX_SELF_HOSTED_REMOTE_CACHE_SERVER} after 30 attempts (last status ${code}, wanted 404 or 200)" >&2
            exit 1
          fi
      - run: npm run typecheck
      - cancel: cache-server

  test:
    runs-on: ubuntu-24.04-arm
    # Generic hang insurance -- see the build job.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      # Sidecar dogfood block -- see the build job above.
      - name: Pre-set the Nx cache client vars for the sidecar
        shell: bash
        run: |
          set -euo pipefail
          echo "NX_SELF_HOSTED_REMOTE_CACHE_SERVER=http://127.0.0.1:3000" >> "$GITHUB_ENV"
          token="$(node -e 'process.stdout.write(require("crypto").randomBytes(32).toString("hex"))')"
          echo "::add-mask::${token}"
          echo "NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN=${token}" >> "$GITHUB_ENV"
      - uses: ./start-cache-server
        id: cache-server
        background: true
        with:
          port: '3000'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for the loopback sidecar
        shell: bash
        run: |
          set -euo pipefail
          auth="Authorization: Bearer ${NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN}"
          code=000
          for _ in $(seq 1 30); do
            code=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' -H "${auth}" "${NX_SELF_HOSTED_REMOTE_CACHE_SERVER}/v1/cache/deadbeef" || true)
            if [ "${code}" = "404" ] || [ "${code}" = "200" ]; then
              break
            fi
            sleep 1
          done
          if [ "${code}" != "404" ] && [ "${code}" != "200" ]; then
            echo "sidecar not ready on ${NX_SELF_HOSTED_REMOTE_CACHE_SERVER} after 30 attempts (last status ${code}, wanted 404 or 200)" >&2
            exit 1
          fi
      - run: npm run test
      - cancel: cache-server

  # THE THREE windows-11-arm REUSE LEGS (XOS-04), and they are the CONSUMER half of
  # this milestone. Each runs the SAME Nx target as its ubuntu counterpart above, and
  # build/typecheck/test carry NO platform discriminator (only `integration` does --
  # see its comment below), so each Windows leg computes the SAME task hash its ubuntu
  # producer just wrote and can restore that entry. That restore IS the XOS-05
  # observation; without these jobs there is nothing on Windows to observe.
  #
  # THE `needs:` EDGE IS A PRODUCER-TO-CONSUMER DEPENDENCY FOR HIT-ABILITY, NEVER AN
  # ORDERING-CORRECTNESS CONTROL. PROJECT.md locks that cross-OS sharing rests on target
  # platform-agnosticism and NEVER on leg ordering, and XOS-06 forbids ordering from
  # becoming a correctness control: no result computed here changes if the order
  # changes, and a leg that ran first would MISS and execute, which is slow rather than
  # wrong. What the edge buys is that the producer has finished before the consumer
  # starts. WITHOUT it the two legs compute the same hash at the same time, so both
  # MISS, both execute, and both call saveCache(nx-cache-H) -- the race TRUST-11
  # predicted in advance (.planning/phases/10-os-invariant-releases-mirror/
  # 10-SECURITY.md, the Q1 section). The edge removes the RACE. It does NOT remove the
  # SECOND PRODUCER: from these jobs onward a windows-11-arm runner writes
  # build/typecheck/test entries too, and that half is recorded in the same Q1 section
  # rather than left implicit.
  #
  # `integration` IS NOT THE WIRING PRECEDENT, and that is worth writing down because it
  # is the only existing two-OS Nx-target job, so it is the first thing a reader reaches
  # for. Two independent reasons its matrix cannot serve here:
  #   (a) `needs:` is per-JOB and never per-LEG, so a matrix leg cannot depend on its
  #       sibling -- a matrix cannot express XOS-08 at all; and
  #   (b) `integration`'s two legs compute DIFFERENT hashes, because of the
  #       `{ runtime: "node --no-warnings -p process.platform" }` discriminator in
  #       its own target inputs, so parallelism is harmless there and lethal here,
  #       where the two legs computing the SAME hash is the entire point.
  #
  # And do NOT "fix the asymmetry" by giving `dogfood-seed` a Windows leg while in this
  # file. It is ubuntu-ONLY BY DESIGN and its own VACUITY CONDITION comment says why:
  # its key is one per RUN, so a Windows seed leg would make the Windows verify leg
  # restore a Windows-written entry. These legs key on the task HASH, so that reasoning
  # does not transfer.
  build-windows:
    # Consumer of the ubuntu `build` job's entry: a bare scalar naming exactly ONE
    # producer (XOS-08). See the block above for why this is a HIT-ability edge.
    needs: build
    runs-on: windows-11-arm
    # Generic hang insurance -- see the build job.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      # Sidecar dogfood block -- see the build job above, plus one line the ubuntu
      # producers deliberately do not carry: CACHE_READ_ONLY.
      #
      # That knob is ROLE, not TRUST (TRUST-14, D-02a). This leg is a CONSUMER of the
      # ubuntu producer's entry, and producer-versus-consumer role is not derivable
      # from any GitHub-supplied env fact: `push` and same-repo `pull_request` are both
      # correctly write-TRUSTED, and GitHub exposes no per-job read-only lever. The
      # workflow author supplies the one thing the runner cannot. Declining the write
      # is what makes the count gate at the end of this job SOUND -- see that step.
      #
      # It goes in THIS step rather than in the sidecar's own `env:` because a REGULAR
      # step's $GITHUB_ENV writes reach later steps while a BACKGROUND step's do not,
      # which start-cache-server/action.yml's own comment records. And it can only
      # NARROW: select-backend.ts reads it as the LAST branch, after every branch that
      # has already returned a read-only backend or thrown, so it cannot resurrect an
      # outcome control never reaches it from (TRUST-05, D-02b).
      - name: Pre-set the Nx cache client vars for the sidecar
        shell: bash
        run: |
          set -euo pipefail
          echo "NX_SELF_HOSTED_REMOTE_CACHE_SERVER=http://127.0.0.1:3000" >> "$GITHUB_ENV"
          token="$(node -e 'process.stdout.write(require("crypto").randomBytes(32).toString("hex"))')"
          echo "::add-mask::${token}"
          echo "NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN=${token}" >> "$GITHUB_ENV"
          echo "CACHE_READ_ONLY=1" >> "$GITHUB_ENV"
      - uses: ./start-cache-server
        id: cache-server
        background: true
        with:
          port: '3000'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for the loopback sidecar
        shell: bash
        run: |
          set -euo pipefail
          auth="Authorization: Bearer ${NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN}"
          code=000
          for _ in $(seq 1 30); do
            code=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' -H "${auth}" "${NX_SELF_HOSTED_REMOTE_CACHE_SERVER}/v1/cache/deadbeef" || true)
            if [ "${code}" = "404" ] || [ "${code}" = "200" ]; then
              break
            fi
            sleep 1
          done
          if [ "${code}" != "404" ] && [ "${code}" != "200" ]; then
            echo "sidecar not ready on ${NX_SELF_HOSTED_REMOTE_CACHE_SERVER} after 30 attempts (last status ${code}, wanted 404 or 200)" >&2
            exit 1
          fi
      # Tee'd, and named, for the reason the integration job's copy states: the bare
      # `- run:` form leaves this leg with NO runtime cache observation at all. A leg
      # that MISSED and executed locally exits 0 identically to one that HIT, so these
      # three -- which exist for NOTHING BUT the HIT observation -- could not report the
      # one thing they are for. An @actions/cache bump that broke cross-OS restore would
      # leave all three GREEN and hash-parity green (it compares hashes, not storage).
      # The dogfood canary DOES catch that bump -- that is its stated job as the
      # ROBUST-03 upgrade canary, its verify leg MISSes and reddens, and since CR-18 it
      # does so on same-repo PRs too. But it catches a DIFFERENT thing from these
      # records: it drives a DIRECT scripted PUT/GET on a run-scoped key, so it never
      # observes whether a REAL Nx build/typecheck/test task got a remote HIT. These
      # per-target records are the only runtime observation of THAT -- and on a fork
      # pull request, where the dogfood pair is skipped, the only cross-OS signal at all.
      # Under set -euo pipefail the tee preserves a failing Nx exit code.
      - name: Run the build target and tee its output
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee build-nx.log
      # GATED at a floor of 1, and the floor is sound ONLY because the step above made
      # this leg unable to write. The silent failure that ungated it until XOS-09: a
      # leg that can save launders its own failure, because a broken cross-OS restore
      # makes it MISS, execute the target and SAVE its own entry -- and a re-run of the
      # same commit then HITs that self-produced entry, taking a floor check green with
      # cross-OS reuse still dead. A gate a re-run can launder is worse than no gate,
      # because it reads as coverage.
      # CACHE_READ_ONLY removes the premise rather than mitigating it. With no write
      # path, no windows-produced entry for these hashes can ever exist, so a
      # `[remote cache]` label here is NECESSARILY a restore of the ubuntu producer's
      # entry. That property is INDUCTIVE: it holds of every run, and rests on nothing
      # about job ordering, about this being a first run, or about anything else being
      # true right now.
      # Keep LIVENESS separate from correctness, because they are two arguments and
      # only one of them is this step's. XOS-08's `needs:` edge is why the entry is
      # PRESENT at all -- the ubuntu producer repopulates it earlier in the SAME run.
      # Read-only-ness is why a green MEANS something. Neither substitutes for the
      # other, and a rationale resting this gate on the `needs:` edge has confused them.
      # Second-order effect, and it is the intended one: a MISS is now PERMANENT for
      # that hash, because no self-produced entry ever backfills it. A red gate here
      # stays red until the producer side is fixed rather than going green on a re-run.
      # What this gate still does NOT cover: these three legs run the COMMITTED public
      # `./start-cache-server` bundle, while the dogfood pair runs
      # `uses: ./packages/github-cache` built in-job. Nothing here ties the bundle to
      # the source it was built from -- `action-bundle-drift` is the control that does.
      # Over-reading a green here as evidence about uncommitted source is the mistake
      # CR-18 caught the first time.
      # The `|| true` keeps a legitimate zero REACHING the comparison: under pipefail a
      # zero-match grep exits 1 and would abort the step before the gate ran, turning a
      # clear failure carrying an annotation into an opaque one carrying none.
      - name: Gate on the cross-OS remote-cache label count for this leg
        shell: bash
        run: |
          set -euo pipefail
          count=$({ grep -o -F '[remote cache]' build-nx.log || true; } | wc -l | tr -d '[:space:]')
          echo "remote-cache label occurrences on windows-11-arm (build): ${count} -- GATED at a floor of 1"
          if [ "${count}" -lt 1 ]; then
            echo "::error::build-windows got ${count} [remote cache] labels, but this leg is read-only and can only get one by restoring the ubuntu build job's entry. Either cross-OS restore is broken (an @actions/cache regression or a cache-version drift), or the ubuntu producer never populated the entry this run. Check the producer job's own log for a HIT or a save before assuming the former."
            exit 1
          fi
      - cancel: cache-server

